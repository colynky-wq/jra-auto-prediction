name: Patch 本会外 Trainer Parser

on:
  push:
    branches: [fix/jra-honkaigai-trainer-20261023]
    paths:
      - '.github/workflows/patch-honkaigai-trainer.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'
      - name: Patch trainer parser to use p.trainer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('production/jra_entry_source.py')
          s=p.read_text(encoding='utf-8')
          start_marker='        trainer_full = None\n        affiliation_node = info_td.find(\n'
          end_marker='                trainer_full = trainer_a.get_text(" ", strip=True)\n'
          start=s.index(start_marker)
          end=s.index(end_marker,start)+len(end_marker)
          lines=[
              '        trainer_full = None',
              '',
              '        # Current JRA pages expose trainers in p.trainer. Local/NAR trainers',
              '        # are labelled 本会外 and are not links, so previous-anchor lookup',
              '        # can accidentally return the horse-name link.',
              '        trainer_node = info_td.select_one("p.trainer")',
              '        if trainer_node is not None:',
              '            division_node = trainer_node.select_one(".division")',
              '            if division_node is not None:',
              '                division_node.extract()',
              '            trainer_full = trainer_node.get_text(" ", strip=True) or None',
              '        else:',
              '            # Historical-layout fallback kept for replay pages.',
              '            affiliation_node = info_td.find(',
              '                string=re.compile(r"\\(\\s*(美浦|栗東|本会外)\\s*\\)")',
              '            )',
              '            if affiliation_node is not None:',
              '                trainer_a = affiliation_node.find_previous("a")',
              '                if trainer_a is not None and info_td in trainer_a.parents:',
              '                    trainer_full = trainer_a.get_text(" ", strip=True)',
          ]
          p.write_text(s[:start]+'\n'.join(lines)+'\n'+s[end:],encoding='utf-8')
          PY
          python -m py_compile production/jra_entry_source.py
      - name: Verify JRA and 本会外 trainer names
        env:
          PYTHONPATH: production
        run: |
          python - <<'PY'
          from datetime import timedelta, timezone
          from jra_entry_source import fetch_entry_table
          JST=timezone(timedelta(hours=9))
          cases={'202608040810': {7:'小国博行', 9:'荒山勝徳'}, '202605040811': {8:'飯田弘道'}}
          for rid, expected in cases.items():
              d, _, _ = fetch_entry_table(rid,'20261024',JST)
              got={int(r['馬番']): str(r['調教師_JRA']).replace(' ','') for _,r in d.iterrows()}
              assert all(v and v != 'None' for v in got.values()), (rid,got)
              for no,name in expected.items():
                  print('TRAINER_PARSE',rid,no,got.get(no))
                  assert got.get(no)==name, (rid,no,got.get(no),name)
          print('HONKAIGAI_TRAINER_PARSE_OK')
          PY
      - name: Commit parser fix to branch
        run: |
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add production/jra_entry_source.py
          git diff --cached --quiet && exit 0
          git commit -m 'Parse JRA trainer elements including 本会外'
          git push origin HEAD:fix/jra-honkaigai-trainer-20261023