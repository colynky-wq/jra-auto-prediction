name: KeibaAI Swift UI syntax

on:
  pull_request:
    paths:
      - 'ios/KeibaAI/KeibaAI/*.swift'
      - '.github/workflows/ios-ui-syntax.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Parse SwiftUI screens
        run: |
          swiftc -frontend -parse \
            ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift \
            ios/KeibaAI/KeibaAI/KeibaAIApp.swift
