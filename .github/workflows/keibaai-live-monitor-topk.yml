name: KeibaAI Live Monitor Top2 Top3

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date YYYYMMDD (blank = today JST)'
        required: false
        default: ''
      mode:
        description: 'plan / preflight / live'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - preflight
          - live
      target_race_id:
        description: 'Optional 12-digit race ID'
        required: false
        default: ''
      max_runtime_minutes:
        description: 'Live mode maximum runtime minutes'
        required: false
        default: '30'
      poll_seconds:
        description: 'Live mode polling interval seconds'
        required: false
        default: '20'
      publish_to_app:
        description: 'Write live Top2/Top3 result to RaceData.json for the app'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  topk-live:
    name: Win Top2 Top3 live monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: pip install -r production/requirements.txt

      - name: Install network dependencies
        run: pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Smoke-test Top2 Top3 runtime
        run: python production/smoke_topk_runtime.py

      - name: Run Win Top2 Top3 live monitor
        env:
          KEIBAAI_LIVE_DATE: ${{ inputs.target_date }}
          KEIBAAI_LIVE_MODE: ${{ inputs.mode }}
          KEIBAAI_LIVE_RACE_ID: ${{ inputs.target_race_id }}
          KEIBAAI_LIVE_MAX_MINUTES: ${{ inputs.max_runtime_minutes }}
          KEIBAAI_LIVE_POLL_SECONDS: ${{ inputs.poll_seconds }}
          KEIBAAI_PUBLISH_RACEDATA: ${{ inputs.publish_to_app }}
        run: |
          if [ "${{ inputs.publish_to_app }}" = "true" ]; then
            python production/live_monitor_topk_publish.py
          else
            python production/live_monitor_topk.py
          fi

      - name: Publish RaceData.json to main branch
        if: ${{ inputs.publish_to_app == 'true' && inputs.mode == 'live' }}
        run: |
          if git diff --quiet -- RaceData.json; then
            echo "RaceData.json was not changed; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RaceData.json
          git commit -m "Publish live Top2 Top3 RaceData"
          git push origin HEAD:${GITHUB_REF_NAME}
