name: KeibaAI Live Monitor Dry Run

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JST date YYYYMMDD'
        required: true
        default: '20261012'
      mode:
        description: 'plan = schedule only, preflight = JRA entry check, live = actual 8-12 minute monitoring'
        required: true
        type: choice
        options:
          - plan
          - preflight
          - live
        default: plan
      target_race_id:
        description: 'Optional 12-digit race ID. Leave blank for all races.'
        required: false
        default: ''
      max_runtime_minutes:
        description: 'Live mode maximum runtime in minutes'
        required: true
        default: '30'
      poll_seconds:
        description: 'Live mode polling interval in seconds'
        required: true
        default: '20'

permissions:
  contents: read

jobs:
  monitor:
    name: Read-only 10-minute live monitor
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: pip install -r production/requirements.txt

      - name: Install live-monitor network dependencies
        run: pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Run read-only live monitor
        env:
          KEIBAAI_LIVE_DATE: ${{ inputs.target_date }}
          KEIBAAI_LIVE_MODE: ${{ inputs.mode }}
          KEIBAAI_LIVE_RACE_ID: ${{ inputs.target_race_id }}
          KEIBAAI_LIVE_MAX_MINUTES: ${{ inputs.max_runtime_minutes }}
          KEIBAAI_LIVE_POLL_SECONDS: ${{ inputs.poll_seconds }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/live_monitor_dry_run.py
