name: KeibaAI Horse Profile Research

on:
  push:
    branches:
      - research/horse-profile-course-v1
    paths:
      - 'production/horse_profile_runtime.py'
      - 'production/build_horse_profiles.py'
      - 'production/research_course_affinity.py'
      - '.github/workflows/keibaai-horse-profile-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-profile-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: pip install -r production/requirements.txt
      - name: Compile research code
        run: |
          python -m py_compile production/horse_profile_runtime.py
          python -m py_compile production/build_horse_profiles.py
          python -m py_compile production/research_course_affinity.py
      - name: Build recent 250-horse sample
        env:
          KEIBAAI_HORSE_PROFILE_LIMIT: '250'
          KEIBAAI_HORSE_PROFILE_RECENT: '12'
        run: python production/build_horse_profiles.py
      - name: Validate app-facing database shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          idx = json.load(open('HorseIndex.json', encoding='utf-8'))
          manifest = json.load(open('HorseProfileManifest.json', encoding='utf-8'))
          assert idx['horseCount'] == manifest['horseCount']
          assert 1 <= idx['horseCount'] <= 250
          assert manifest['scope'] == 'JRA flat races only'
          assert manifest['latestHistoryDate']

          first = idx['horses'][0]
          shard = json.load(open(Path('HorseProfiles') / f"{first['shard']}.json", encoding='utf-8'))
          profile = shard['profiles'][first['profileID']]
          assert profile['name'] == first['name']
          assert profile['career']['starts'] >= 1
          assert isinstance(profile['recentRaces'], list) and profile['recentRaces']
          assert isinstance(profile['venueStats'], list)
          assert isinstance(profile['venueSurfaceStats'], list)
          assert isinstance(profile['distanceStats'], list)
          print('HORSE_PROFILE_DB_OK', manifest)
          print('SAMPLE_PROFILE', profile['name'], profile['career'], profile['bestVenues'][:2])
          PY
      - name: Run leakage-safe racecourse affinity research
        run: python production/research_course_affinity.py
      - name: Validate affinity report
        run: |
          python - <<'PY'
          import json
          p = json.load(open('reports/research_course_affinity.json', encoding='utf-8'))
          assert p['evaluationYear'] == 2025
          assert p['evaluationRows'] > 0
          assert p['featureCandidates'] == ['同場適性', '同場回数c', '同場芝ダ適性', '同場芝ダ回数c']
          assert p['venue']
          assert p['venueSurface']
          print('COURSE_AFFINITY_RESEARCH_OK')
          print('VENUE_BUCKETS', p['venue'])
          print('VENUE_SURFACE_BUCKETS', p['venueSurface'])
          PY
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-horse-profile-course-research
          path: |
            HorseIndex.json
            HorseProfileManifest.json
            HorseProfiles/
            reports/research_course_affinity.json
          retention-days: 14
