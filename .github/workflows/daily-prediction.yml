name: Daily Horse Racing Prediction

on:
  schedule:
    - cron: '0 12 * * *'  # 毎日 12:00 UTC（日本時間 21:00）
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-browser-l10n
          
      - name: Scrape today's race results and update pkl
        run: python scrape_and_update.py
      
      - name: Download pkl from Releases
        run: |
          wget https://github.com/colynky-wq/jra-auto-prediction/releases/download/v1.0/history_data.pkl
      
      - name: Scrape today's race results and update pkl (Selenium)
        run: python scrape_and_update_selenium.py
      
      - name: Run prediction
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: python main.py
