name: KeibaAI Early Prediction

on:
  push:
    branches: [main]
    paths:
      - 'production/early_prediction_runtime.py'
      - 'production/publish_early_racedata.py'
      - 'production/validate_early_prediction.py'
      - 'production/all_bet_recommendation_shadow.py'
      - 'production/test_all_bet_recommendation_shadow.py'
      - 'production/live_monitor_topk.py'
      - 'production/live_monitor_dry_run.py'
      - 'production/jra_entry_source.py'
      - 'production/horse_identity_runtime.py'
      - 'production/feature_engine.py'
      - 'production/topk_runtime.py'
      - '.github/workflows/keibaai-early-prediction.yml'
  schedule:
    - cron: '15 10 * * *'  # 19:15 JST
    - cron: '35 10 * * *'  # 19:35 JST retry
    - cron: '55 10 * * *'  # 19:55 JST final evening retry
    - cron: '30 22 * * *'  # 07:30 JST morning refresh
  workflow_dispatch:
    inputs:
      target_date:
        description: YYYYMMDD; blank means auto
        required: false
        default: ''
      stage:
        description: previous_evening or morning; blank means auto
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: keibaai-early-prediction-main
  cancel-in-progress: false

jobs:
  early:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target and stage
        id: target
        shell: bash
        run: |
          schedule='${{ github.event.schedule }}'
          event_name='${{ github.event_name }}'
          jst_hour=$(TZ=Asia/Tokyo date '+%H')
          evening=false
          if [ "$schedule" = '15 10 * * *' ] || [ "$schedule" = '35 10 * * *' ] || [ "$schedule" = '55 10 * * *' ]; then
            evening=true
          elif [ "$event_name" = 'push' ] && [ "$jst_hour" -ge 12 ]; then
            evening=true
          fi

          if [ -n '${{ github.event.inputs.target_date }}' ]; then
            date8='${{ github.event.inputs.target_date }}'
          elif [ "$evening" = true ]; then
            date8=$(TZ=Asia/Tokyo date -d '+1 day' '+%Y%m%d')
          else
            date8=$(TZ=Asia/Tokyo date '+%Y%m%d')
          fi

          if [ -n '${{ github.event.inputs.stage }}' ]; then
            stage='${{ github.event.inputs.stage }}'
          elif [ "$evening" = true ]; then
            stage='previous_evening'
          else
            stage='morning'
          fi

          echo "date8=$date8" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "Early snapshot target=$date8 stage=$stage schedule=$schedule event=$event_name"

      - name: Check whether JRA races exist on target date
        id: day
        shell: bash
        run: bash .github/scripts/keibaai-race-day-check.sh '${{ steps.target.outputs.date8 }}'

      - uses: actions/setup-python@v6
        if: steps.day.outputs.has_races == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        if: steps.day.outputs.has_races == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Compile early prediction and recommendation runtimes
        if: steps.day.outputs.has_races == 'true'
        run: |
          python -m py_compile production/early_prediction_runtime.py
          python -m py_compile production/validate_early_prediction.py
          python -m py_compile production/publish_early_racedata.py
          python -m py_compile production/all_bet_recommendation_shadow.py
          python production/test_all_bet_recommendation_shadow.py

      - name: Build early prediction snapshot
        if: steps.day.outputs.has_races == 'true'
        env:
          KEIBAAI_EARLY_DATE: ${{ steps.target.outputs.date8 }}
          KEIBAAI_EARLY_STAGE: ${{ steps.target.outputs.stage }}
        run: python production/early_prediction_runtime.py

      - name: Validate complete early snapshot before publishing
        if: steps.day.outputs.has_races == 'true'
        env:
          KEIBAAI_EARLY_DATE: ${{ steps.target.outputs.date8 }}
          KEIBAAI_EARLY_STAGE: ${{ steps.target.outputs.stage }}
        run: python production/validate_early_prediction.py

      - name: Publish early snapshot through canonical RaceData feed
        if: steps.day.outputs.has_races == 'true'
        env:
          KEIBAAI_EARLY_STAGE: ${{ steps.target.outputs.stage }}
        run: python production/publish_early_racedata.py

      - name: Build honest all-bet early status
        if: steps.day.outputs.has_races == 'true'
        run: python production/all_bet_recommendation_shadow.py

      - name: Publish validated snapshot atomically
        if: steps.day.outputs.has_races == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for required in EarlyPredictionData.json RaceData.json AllBetRecommendationData.json; do
            if [ ! -f "$required" ]; then
              echo "$required was not produced."
              exit 1
            fi
          done

          date8='${{ steps.target.outputs.date8 }}'
          stage='${{ steps.target.outputs.stage }}'
          publish_dir="$RUNNER_TEMP/keibaai-early-${date8}-${stage}"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir/reports/${date8}"

          cp EarlyPredictionData.json "$publish_dir/EarlyPredictionData.json"
          cp RaceData.json "$publish_dir/RaceData.json"
          cp AllBetRecommendationData.json "$publish_dir/AllBetRecommendationData.json"
          cp EarlyPredictionData.json "$publish_dir/reports/${date8}/EarlyPredictionData.json"
          cp RaceData.json "$publish_dir/reports/${date8}/RaceData.early.json"
          cp AllBetRecommendationData.json "$publish_dir/reports/${date8}/AllBetRecommendationData.json"

          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Atomic publish attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "reports/${date8}"
            cp "$publish_dir/EarlyPredictionData.json" EarlyPredictionData.json
            cp "$publish_dir/RaceData.json" RaceData.json
            cp "$publish_dir/AllBetRecommendationData.json" AllBetRecommendationData.json
            cp "$publish_dir/reports/${date8}/EarlyPredictionData.json" "reports/${date8}/EarlyPredictionData.json"
            cp "$publish_dir/reports/${date8}/RaceData.early.json" "reports/${date8}/RaceData.early.json"
            cp "$publish_dir/reports/${date8}/AllBetRecommendationData.json" "reports/${date8}/AllBetRecommendationData.json"

            if git diff --quiet -- EarlyPredictionData.json RaceData.json AllBetRecommendationData.json "reports/${date8}/EarlyPredictionData.json" "reports/${date8}/RaceData.early.json" "reports/${date8}/AllBetRecommendationData.json"; then
              echo 'No early prediction change after syncing latest main.'
              exit 0
            fi

            git add EarlyPredictionData.json RaceData.json AllBetRecommendationData.json "reports/${date8}/EarlyPredictionData.json" "reports/${date8}/RaceData.early.json" "reports/${date8}/AllBetRecommendationData.json"
            git commit -m "Update early prediction ${date8} ${stage}"

            if git push origin HEAD:main; then
              echo "Atomic early prediction publish succeeded on attempt ${attempt}."
              exit 0
            fi

            echo 'Remote main advanced during publish; retrying from latest main without merging generated JSON.'
          done

          echo 'Failed to publish validated early prediction after 3 atomic attempts.'
          exit 1
