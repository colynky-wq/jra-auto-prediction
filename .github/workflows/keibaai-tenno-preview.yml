name: KeibaAI Tenno Sho Preview

on:
  push:
    branches: [keibaai-tenno-preview]
    paths:
      - '.github/workflows/keibaai-tenno-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'
      - name: Run isolated Tokyo 11R early prediction
        env:
          KEIBAAI_EARLY_DATE: '20261101'
          KEIBAAI_EARLY_STAGE: 'previous_evening'
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          import production.early_prediction_runtime as ep

          date8='20261101'
          ep.base.TARGET_DATE8=date8
          ep.live.base.TARGET_DATE8=date8
          target_date=pd.Timestamp('2026-11-01')
          hist=ep.base.load_history(target_date)
          races=ep.base.fetch_schedule(date8)
          target=[r for r in races if r.get('venue')=='東京' and int(r.get('race_no') or 0)==11]
          if len(target) != 1:
              raise RuntimeError(f'Tokyo 11R target count={len(target)}')
          out=ep._safe_predict(target[0], hist, target_date)
          ranked=out.sort_values('AI勝率(%)', ascending=False).reset_index(drop=True)
          print('TENNO_PREVIEW_BEGIN')
          print(ranked.to_json(orient='records', force_ascii=False))
          print('TENNO_PREVIEW_END')
          PY
