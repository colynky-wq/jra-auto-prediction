name: KeibaAI WIN5 Formal Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'production/win5_formal_review.py'
      - 'production/test_win5_formal_review.py'
      - '.github/workflows/keibaai-win5-formal-review.yml'
  push:
    branches:
      - main
    paths:
      - 'production/win5_formal_review.py'
      - 'production/test_win5_formal_review.py'
      - '.github/workflows/keibaai-win5-formal-review.yml'
      - 'reports/*/win5_v1/session.json'
      - 'reports/*/win5_payouts_v1/session.json'
  schedule:
    # 17:50 JST. Covers normal Sunday WIN5 and special Sat/Mon race days without
    # coupling the five-race review to the ordinary per-race T-10 review.
    - cron: '50 8 * * *'

permissions:
  contents: write

concurrency:
  group: keibaai-win5-formal-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Verify WIN5 formal review contract
        run: |
          python -m py_compile production/win5_formal_review.py production/test_win5_formal_review.py
          PYTHONPATH=production python production/test_win5_formal_review.py

      - name: Build WIN5 formal review
        if: github.event_name != 'pull_request'
        run: PYTHONPATH=production python production/win5_formal_review.py

      - name: Publish material review changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add Win5FormalReview.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No material WIN5 formal review changes.'
            exit 0
          fi
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git commit -m 'Update formal WIN5 prospective review'
          git pull --rebase origin main
          git push origin HEAD:main
