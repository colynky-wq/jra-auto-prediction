name: KeibaAI Top2 Top3 Model Research

on:
  workflow_dispatch:
    inputs:
      apply_models:
        description: 'Install validated Top2/Top3 models into production/?'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: keibaai-top2-top3-model-research
  cancel-in-progress: false

jobs:
  train-top2-top3:
    name: Train and validate Top2 / Top3 models
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: pip install -r production/requirements.txt

      - name: Train Top2 / Top3 research models
        env:
          KEIBAAI_TOPK_APPLY: ${{ inputs.apply_models }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/train_top2_top3_models.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-top2-top3-model-research
          path: topk_model_artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Commit models only when apply_models=true
        if: ${{ inputs.apply_models == 'true' }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- production/lightgbm_top2_fixed_2025.txt production/lightgbm_top3_fixed_2025.txt production/lightgbm_top2_fixed_2025_info.json production/lightgbm_top3_fixed_2025_info.json reports/model_research)" ]; then
            echo 'No Top2/Top3 model changes to commit.'
            exit 0
          fi

          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add \
            production/lightgbm_top2_fixed_2025.txt \
            production/lightgbm_top3_fixed_2025.txt \
            production/lightgbm_top2_fixed_2025_info.json \
            production/lightgbm_top3_fixed_2025_info.json \
            reports/model_research
          git commit -m 'Add KeibaAI Top2 and Top3 probability models'
          git push
