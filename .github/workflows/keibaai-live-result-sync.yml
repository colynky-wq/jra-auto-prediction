name: KeibaAI Live Result Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/keibaai-live-result-sync.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JST date YYYYMMDD. Leave blank to use today.'
        required: false
        default: ''
  schedule:
    # Every 5 minutes from 09:00 through 17:59 JST.
    # On non-race/stale-data days the script exits without changing files.
    - cron: '*/5 0-8 * * *'

permissions:
  contents: write

concurrency:
  group: keibaai-live-result-sync
  cancel-in-progress: false

jobs:
  sync-results:
    name: Publish completed race results for app comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'

      - name: Compile result and performance publishers
        run: |
          python -m py_compile production/build_result_data_live.py
          python -m py_compile production/build_performance_data.py

      - name: Build app ResultData
        env:
          KEIBAAI_RESULT_DATE: ${{ github.event.inputs.target_date || '' }}
          KEIBAAI_RESULT_DELAY_MINUTES: '5'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/build_result_data_live.py

      - name: Build app PerformanceData
        run: python production/build_performance_data.py

      - name: Commit ResultData and PerformanceData when changed
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- ResultData.json PerformanceData.json reports)" ]; then
            echo 'No result/performance changes to publish.'
            exit 0
          fi

          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add ResultData.json PerformanceData.json reports
          git commit -m "Update KeibaAI live results and performance"
          git pull --rebase origin main
          git push origin HEAD:main
