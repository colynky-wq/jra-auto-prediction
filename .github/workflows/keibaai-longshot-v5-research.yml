name: KeibaAI Longshot V5 Measured Lap Research
on:
  pull_request:
    paths:
      - 'production/longshot_v5_lap_features.py'
      - 'production/research_longshot_top3_v5.py'
      - 'production/test_longshot_v5_lap_features.py'
      - '.github/workflows/keibaai-longshot-v5-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r production/requirements.txt
      - run: python production/test_longshot_v5_lap_features.py -v
      - name: Audit official lap archive and compare V5 against frozen V2
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python production/research_longshot_top3_v5.py
      - uses: actions/upload-artifact@v4
        with:
          name: longshot-v5-research
          path: research/model_candidates/longshot_top3_v5/
