name: KeibaAI Early Prediction

on:
  push:
    branches: [main]
    paths:
      - 'production/early_prediction_runtime.py'
      - 'production/publish_early_racedata.py'
      - '.github/workflows/keibaai-early-prediction.yml'
  schedule:
    # Previous-evening prediction: start early and retry so GitHub schedule delays
    # do not push the first usable snapshot past 20:00 JST.
    - cron: '0 10 * * *'   # 19:00 JST
    - cron: '30 10 * * *'  # 19:30 JST retry
    - cron: '0 11 * * *'   # 20:00 JST fallback
    # Morning refresh for the current day.
    - cron: '30 22 * * *'  # 07:30 JST
  workflow_dispatch:
    inputs:
      target_date:
        description: YYYYMMDD; blank means auto
        required: false
        default: ''
      stage:
        description: previous_evening or morning; blank means auto
        required: false
        default: ''

permissions:
  contents: write

jobs:
  early:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target and stage
        id: target
        shell: bash
        run: |
          schedule='${{ github.event.schedule }}'
          if [ -n '${{ github.event.inputs.target_date }}' ]; then
            date8='${{ github.event.inputs.target_date }}'
          elif [ "$schedule" = '0 10 * * *' ] || [ "$schedule" = '30 10 * * *' ] || [ "$schedule" = '0 11 * * *' ]; then
            date8=$(TZ=Asia/Tokyo date -d '+1 day' '+%Y%m%d')
          else
            date8=$(TZ=Asia/Tokyo date '+%Y%m%d')
          fi

          if [ -n '${{ github.event.inputs.stage }}' ]; then
            stage='${{ github.event.inputs.stage }}'
          elif [ "$schedule" = '0 10 * * *' ] || [ "$schedule" = '30 10 * * *' ] || [ "$schedule" = '0 11 * * *' ]; then
            stage='previous_evening'
          else
            stage='morning'
          fi

          echo "date8=$date8" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "Early snapshot target=$date8 stage=$stage schedule=$schedule"

      - name: Check whether JRA races exist on target date
        id: day
        shell: bash
        run: bash .github/scripts/keibaai-race-day-check.sh '${{ steps.target.outputs.date8 }}'

      - uses: actions/setup-python@v6
        if: steps.day.outputs.has_races == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        if: steps.day.outputs.has_races == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Compile early prediction runtime and publisher
        if: steps.day.outputs.has_races == 'true'
        run: |
          python -m py_compile production/early_prediction_runtime.py
          python -m py_compile production/publish_early_racedata.py

      - name: Build early prediction snapshot
        if: steps.day.outputs.has_races == 'true'
        env:
          KEIBAAI_EARLY_DATE: ${{ steps.target.outputs.date8 }}
          KEIBAAI_EARLY_STAGE: ${{ steps.target.outputs.stage }}
        run: python production/early_prediction_runtime.py

      - name: Publish early snapshot through canonical RaceData feed
        if: steps.day.outputs.has_races == 'true'
        env:
          KEIBAAI_EARLY_STAGE: ${{ steps.target.outputs.stage }}
        run: python production/publish_early_racedata.py

      - name: Publish snapshot if produced
        if: steps.day.outputs.has_races == 'true'
        shell: bash
        run: |
          if [ ! -f EarlyPredictionData.json ]; then
            echo 'EarlyPredictionData.json was not produced.'
            exit 1
          fi
          if [ ! -f RaceData.json ]; then
            echo 'RaceData.json was not produced.'
            exit 1
          fi
          date8='${{ steps.target.outputs.date8 }}'
          mkdir -p "reports/${date8}"
          cp EarlyPredictionData.json "reports/${date8}/EarlyPredictionData.json"
          cp RaceData.json "reports/${date8}/RaceData.early.json"
          if git diff --quiet -- EarlyPredictionData.json RaceData.json "reports/${date8}/EarlyPredictionData.json" "reports/${date8}/RaceData.early.json"; then
            echo 'No early prediction change.'
            exit 0
          fi
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add EarlyPredictionData.json RaceData.json "reports/${date8}/EarlyPredictionData.json" "reports/${date8}/RaceData.early.json"
          git commit -m "Update early prediction ${{ steps.target.outputs.date8 }} ${{ steps.target.outputs.stage }}"
          git pull --rebase origin main
          git push origin HEAD:main
