name: Temporary navigation test patch
on:
  push:
    branches:
      - fix/phone-navigation-stale-element-20261026
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/phone-navigation-stale-element-20261026
      - name: Refresh race-card query after compact-column return
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/tests/PhoneNavigationUITests.swift')
          s=p.read_text(encoding='utf-8')
          old='''        back.tap()\n        XCTAssertTrue(predicted.waitForExistence(timeout: 5))\n        // Repeating the same selection catches a stale compact-column binding.\n        predicted.tap()\n        XCTAssertTrue(back.waitForExistence(timeout: 5))\n        back.tap()\n        let missing = app.descendants(matching: .any).matching(identifier: "race-card-202605040602").firstMatch\n'''
          new='''        back.tap()\n        let predictedAgain = app.descendants(matching: .any).matching(identifier: "race-card-202605040601").firstMatch\n        XCTAssertTrue(predictedAgain.waitForExistence(timeout: 5))\n        // Repeating the same selection catches a stale compact-column binding. Re-query after\n        // returning because an XCUIElement resolved before a NavigationSplitView column switch\n        // can become stale while the newly rendered card is already visible.\n        predictedAgain.tap()\n        XCTAssertTrue(back.waitForExistence(timeout: 5))\n        back.tap()\n        let missing = app.descendants(matching: .any).matching(identifier: "race-card-202605040602").firstMatch\n'''
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          elif 'let predictedAgain = app.descendants' not in s:
              raise SystemExit('expected navigation-test block not found')
          PY
          git diff --check
          git diff -- ios/tests/PhoneNavigationUITests.swift
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add ios/tests/PhoneNavigationUITests.swift
          git commit -m 'Refresh race card after returning from detail'
          git push origin HEAD:fix/phone-navigation-stale-element-20261026
