name: Research longshot V3 historical closing-odds audit

on:
  push:
    branches:
      - research/longshot-v3-market-anchor-20261123
    paths:
      - research/longshot_v3_historical_diagnostics.py
      - .github/workflows/research-longshot-v3-historical.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned past source and models
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned training-time dependencies
        run: pip install --disable-pip-version-check -r production/requirements.txt
      - name: Verify Python syntax
        run: python3 -m py_compile research/longshot_v3_historical_diagnostics.py
      - name: Restore exact SHA-verified historic source from Git history
        run: |
          python3 - <<'PY'
          import json
          print('EXPECTED_HISTORY_SHA',json.load(open('research/model_candidates/longshot_top3_v2/research.json'))['sourceHistorySha256'])
          PY
          expected=$(python3 -c "import json; print(json.load(open('research/model_candidates/longshot_top3_v2/research.json'))['sourceHistorySha256'])")
          found=0
          # Historical V2 was trained on 2026-11-23 01:57 JST, before the
          # 2026-11-23 04:31 JST history update. Fetch only candidate commits.
          for rev in b16abc93f24ce2d43d7ab3e669024c77d4d3fd60 71ec318993fe4ae321902f10e2e07d4c91359aa7 a894a49aaeb93d17ad86ec5ab398f5a185c70b67 8ff756a08c1d273010abe77acde8b82382241c51 46640a0eef0e64a5500e972ea188ba08d462a4ab; do
            git fetch --no-tags --depth=1 origin "$rev"
            git show "$rev:production/production_history.parquet" > frozen_source.parquet
            actual=$(sha256sum frozen_source.parquet | cut -d' ' -f1)
            if [ "$actual" = "$expected" ]; then
              echo "VERIFIED_SOURCE_COMMIT=$rev"
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo 'Exact historical source not found: fail closed'
            exit 1
          fi
      - name: Evaluate frozen 2025 and 2026 using historic closing odds ONLY
        run: |
          python3 research/longshot_v3_historical_diagnostics.py --root . --history-file frozen_source.parquet --output longshot_v3_historical_result.json
      - name: Confirm no production model activation
        run: |
          python3 - <<'PY'
          import json
          result=json.load(open("longshot_v3_historical_result.json"))
          assert result["approved_for_production"] is False
          assert result["auto_bet_enabled"] is False
          print("VERIFIED_RESEARCH_ONLY", [(y,result[y]["races"]) for y in ("2025","2026")])
          PY
      - name: Upload historical research report
        uses: actions/upload-artifact@v4
        with:
          name: longshot-v3-history-closing-odds
          path: longshot_v3_historical_result.json
          retention-days: 7
