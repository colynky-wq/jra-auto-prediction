name: KeibaAI Portfolio Research

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'production/portfolio_shadow.py'
      - 'production/test_portfolio_shadow.py'
      - 'production/all_bet_recommendation_shadow.py'
      - 'production/test_all_bet_recommendation_shadow.py'
      - 'production/formal_10min_evidence.py'
      - 'production/test_formal_10min_evidence.py'
      - 'production/portfolio_review_100.py'
      - 'production/test_portfolio_review_100.py'
      - 'production/portfolio_early_review.py'
      - 'production/test_portfolio_early_review.py'
      - 'production/PORTFOLIO_SHADOW_V1.md'
      - '.github/workflows/keibaai-portfolio-research.yml'
  schedule:
    # 17:45 JST. Result sync normally finishes by about 17:15 JST.
    - cron: '45 8 * * *'

permissions:
  contents: write

concurrency:
  group: keibaai-portfolio-research
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify fixed shadow rules and review contracts
        run: |
          python -m py_compile production/portfolio_shadow.py production/all_bet_recommendation_shadow.py production/formal_10min_evidence.py production/portfolio_review_100.py production/portfolio_early_review.py
          python production/test_portfolio_shadow.py
          python production/test_all_bet_recommendation_shadow.py
          python production/test_formal_10min_evidence.py
          python production/test_portfolio_review_100.py
          python production/test_portfolio_early_review.py

      - name: Build portfolio research projection
        run: |
          python production/portfolio_shadow.py
          python production/all_bet_recommendation_shadow.py

      - name: Build formal prospective 100-race review projection
        run: python production/portfolio_review_100.py

      - name: Build accelerated mixed reference review
        run: python production/portfolio_early_review.py

      - name: Publish research projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'

          git add PortfolioResearchData.json AllBetRecommendationData.json reports/*/PortfolioResearchData.json reports/*/AllBetRecommendationData.json 2>/dev/null || true
          git add -f PortfolioReview100.json PortfolioEarlyReview100.json 2>/dev/null || true
          for path in reports/*/PortfolioReview100.json; do
            [ -e "$path" ] || continue
            git add -f "$path"
          done

          if git diff --cached --quiet; then
            echo 'No portfolio research changes.'
            exit 0
          fi

          git commit -m 'Update KeibaAI portfolio reviews'
          git pull --rebase origin main
          git push origin HEAD:main
