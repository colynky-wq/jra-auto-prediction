name: Fix KeibaAI race date once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-keibaai-race-date-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Apply race-date repair
        run: python3 .github/scripts/fix_keibaai_race_date_once.py
      - name: Run race-day regression checks
        run: |
          python3 ios/tests/test_race_date_display_regression.py
          git diff --check
      - name: Build complete KeibaAI app without signing
        run: xcodebuild -project ios/KeibaAI/KeibaAI.xcodeproj -scheme KeibaAI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/KeibaAI-race-date-build CODE_SIGNING_ALLOWED=NO build
      - name: Commit repaired app and permanent test
        run: |
          git config user.name 'KeibaAI Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift ios/tests/test_race_date_display_regression.py .github/workflows/keibaai-ios-verify.yml
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'Fix KeibaAI race date display for next-day data'
          git push origin HEAD:main
