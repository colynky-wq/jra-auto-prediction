name: KeibaAI Market Independence Experiment

on:
  push:
    branches: [keibaai-market-independence-experiment]
    paths:
      - 'production/research_market_independence.py'
      - 'production/research_market_independence_fair.py'
      - 'production/research_tenno_shadow_compare.py'
      - 'production/research_ac_coverage.py'
      - 'production/research_ac_betting_backtest.py'
      - 'production/research_ac_signal_filter_backtest.py'
      - 'production/research_ac_battle_skip_backtest.py'
      - 'production/research_ac_chaos_filter_backtest.py'
      - '.github/workflows/keibaai-market-independence-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
      - name: Run exact Chaos-filter A/C betting backtest
        run: |
          cd production
          python research_ac_chaos_filter_backtest.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: market-independence-artifacts
          path: market_independence_artifacts/
          if-no-files-found: error
