name: KeibaAI Live Permanent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-live-permanent.yml'
      - 'production/live_monitor_topk_publish.py'
      - 'production/formal_wide_odds_runtime.py'
  schedule:
    - cron: '45 23 * * *'
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      max_minutes:
        description: Optional live-monitor runtime for manual testing
        required: false
        default: '120'

permissions:
  contents: write

concurrency:
  group: keibaai-live-permanent
  # Safety fixes must replace an already-running checkout immediately.
  cancel-in-progress: true

jobs:
  monitor:
    name: Automatic Win Top2 Top3 Signal Wide monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout lightweight startup guard
        uses: actions/checkout@v5
        with:
          path: startup-guard
          sparse-checkout: /.github/scripts/keibaai-race-day-check.sh
          sparse-checkout-cone-mode: false

      - name: Check whether JRA races exist today
        id: day
        shell: bash
        run: |
          set -euo pipefail
          date8=$(TZ=Asia/Tokyo date '+%Y%m%d')
          bash startup-guard/.github/scripts/keibaai-race-day-check.sh "$date8"

      - name: Checkout repository
        if: steps.day.outputs.has_races == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        if: steps.day.outputs.has_races == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        if: steps.day.outputs.has_races == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Smoke-test bundled runtime
        if: steps.day.outputs.has_races == 'true'
        run: |
          python -m py_compile production/live_monitor_topk_publish.py
          python -m py_compile production/wide_odds_runtime.py
          python -m py_compile production/formal_wide_odds_runtime.py
          python -m py_compile production/build_signal_data_v2.py
          python -m py_compile production/repair_wide_odds.py
          python production/smoke_topk_runtime.py

      - name: Choose session runtime
        if: steps.day.outputs.has_races == 'true'
        id: runtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            minutes='${{ github.event.inputs.max_minutes }}'
          elif [ "${{ github.event.schedule }}" = '45 23 * * *' ]; then
            minutes='345'
          elif [ "${{ github.event_name }}" = 'push' ]; then
            minutes='345'
          else
            minutes='180'
          fi
          echo "minutes=${minutes}" >> "$GITHUB_OUTPUT"
          echo "session runtime minutes=${minutes}"

      - name: Configure git publisher
        if: steps.day.outputs.has_races == 'true'
        run: |
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'

      - name: Monitor races and publish one consistent bundle
        id: session
        if: steps.day.outputs.has_races == 'true'
        env:
          KEIBAAI_LIVE_DATE: ${{ steps.day.outputs.target_date }}
          KEIBAAI_LIVE_MODE: 'live'
          KEIBAAI_LIVE_RACE_ID: ''
          KEIBAAI_LIVE_MAX_MINUTES: ${{ steps.runtime.outputs.minutes }}
          KEIBAAI_LIVE_POLL_SECONDS: '20'
          KEIBAAI_PUBLISH_RACEDATA: 'true'
          KEIBAAI_CAPTURE_WIDE_ODDS: 'true'
          KEIBAAI_CAPTURE_PRERACE: 'true'
          KEIBAAI_REFRESH_SIGNALS: 'true'
          KEIBAAI_OUTBOX: ${{ runner.temp }}/keibaai-live-outbox
        shell: bash
        run: |
          set -euo pipefail
          date8='${{ steps.day.outputs.target_date }}'
          python production/live_bundle_publisher.py --date "$date8" \
            --outbox "$KEIBAAI_OUTBOX" --poll-seconds 20 \
            -- python -u production/live_monitor_topk_publish.py

      - name: Preserve live outbox for recovery
        if: always() && steps.day.outputs.has_races == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-live-outbox-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/keibaai-live-outbox/state.json
            ${{ runner.temp }}/keibaai-live-outbox/blobs
          if-no-files-found: ignore
          retention-days: 14
