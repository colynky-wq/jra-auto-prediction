name: KeibaAI Wide Joint Model Research

on:
  push:
    branches:
      - 'research/wide-budget-model-v1'
    paths:
      - 'production/wide_joint_model.py'
      - 'production/research_wide_joint.py'
      - '.github/workflows/keibaai-wide-joint-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keibaai-wide-joint-model-research
  cancel-in-progress: false

jobs:
  research:
    name: Train and validate wide joint probability model
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt

      - name: Compile research code
        run: |
          python -m py_compile production/wide_joint_model.py
          python -m py_compile production/research_wide_joint.py

      - name: Run leakage-safe wide research
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/research_wide_joint.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-wide-joint-research
          path: wide_model_artifacts/
          if-no-files-found: error
          retention-days: 14
