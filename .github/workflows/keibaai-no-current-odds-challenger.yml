name: KeibaAI No Current Odds Challenger Research

# Research only. Future first-frozen T-10 evidence is needed for promotion.
on:
  pull_request:
    paths:
      - 'production/train_no_current_odds_challenger.py'
      - 'production/test_train_no_current_odds_challenger.py'
      - '.github/workflows/keibaai-no-current-odds-challenger.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-no-current-odds-challenger.yml'
      - 'production/train_no_current_odds_challenger.py'
      - 'production/test_train_no_current_odds_challenger.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keibaai-no-current-odds-challenger
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - run: pip install -r production/requirements.txt
      - name: Verify research-only leakage barriers
        run: |
          python -m py_compile production/train_no_current_odds_challenger.py production/test_train_no_current_odds_challenger.py
          python -m unittest discover -s production -p 'test_train_no_current_odds_challenger.py' -v

  historical-train:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install pinned existing research dependencies
        run: pip install -r production/requirements.txt
      - name: Verify no-odds research contract
        run: |
          python -m py_compile production/train_no_current_odds_challenger.py production/test_train_no_current_odds_challenger.py
          python -m unittest discover -s production -p 'test_train_no_current_odds_challenger.py' -v
      - name: Historical training, 2024 early stopping, 2025 descriptive holdout
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '2'
        run: python -u production/train_no_current_odds_challenger.py
      - name: Verify candidate provenance and disabled-promotion policy
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          directory = Path('research/model_candidates/no_current_odds_v1')
          meta = json.loads((directory / 'metadata.json').read_text(encoding='utf-8'))
          raw = (directory / 'win_lightgbm.txt').read_bytes()
          assert meta['modelSha256'] == hashlib.sha256(raw).hexdigest()
          assert meta['featureCount'] == 36
          assert '市場ロジット' not in meta['features']
          assert meta['trainThrough'] == '2023-12-31'
          assert meta['earlyStopping'].startswith('2024-')
          assert meta['retrospectiveHoldout'].startswith('2025-')
          assert meta['candidatePromotionApproved'] is False
          assert meta['formalPredictionAIChanged'] is False
          assert meta['autoBetEnabled'] is False
          assert meta['training']['holdoutRaces'] > 1000
          print('HISTORICAL_CHALLENGER_RESEARCH_VERIFIED',
                meta['training']['holdoutRaces'], meta['modelSha256'])
          PY
      - name: Preserve reproducible candidate model and report
        uses: actions/upload-artifact@v4
        with:
          name: no-current-odds-challenger
          path: research/model_candidates/no_current_odds_v1
          retention-days: 30
          if-no-files-found: error
      - name: Publish isolated candidate without replacing production models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add -f research/model_candidates/no_current_odds_v1/
          if git diff --cached --quiet; then
            echo 'NO_CURRENT_ODDS_CANDIDATE_UNCHANGED'
            exit 0
          fi
          git commit -m 'Publish immutable research-only no-current-odds challenger'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'NO_CURRENT_ODDS_CANDIDATE_PUBLISHED'
              exit 0
            fi
            echo "::warning::Research candidate publication retry $attempt"
            sleep $((2 * attempt))
          done
          echo '::error::Candidate publication failed; artifact remains available.' >&2
          exit 1
