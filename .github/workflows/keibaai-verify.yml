name: KeibaAI Production Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify fixed KeibaAI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r production/requirements.txt

      - name: Verify KeibaAI
        run: python production/verify_production.py
