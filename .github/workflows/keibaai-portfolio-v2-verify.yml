name: KeibaAI Portfolio V2 Verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'production/portfolio_shadow.py'
      - 'production/test_portfolio_shadow.py'
      - 'production/portfolio_shadow_v2.py'
      - 'production/test_portfolio_shadow_v2.py'
      - 'production/PORTFOLIO_SHADOW_V2.md'
      - '.github/workflows/keibaai-portfolio-v2-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proposed change
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify frozen v1 and strict v2 shadow
        run: |
          python -m py_compile production/portfolio_shadow.py production/portfolio_shadow_v2.py
          python production/test_portfolio_shadow.py
          python production/test_portfolio_shadow_v2.py
