name: KeibaAI Same-Day V2.1 Portfolio Review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-same-day-portfolio-review.yml'
      - 'production/same_day_shadow_portfolio_review.py'
      - 'production/test_same_day_shadow_portfolio_review.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keibaai-same-day-v21-portfolio-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test prospective review rules
        run: |
          python -m pip install 'pytest==8.4.2'
          python -m py_compile production/same_day_shadow_portfolio_review.py
          python -m pytest -q production/test_same_day_shadow_portfolio_review.py

      - name: Build prospective cumulative review
        run: python production/same_day_shadow_portfolio_review.py

      - name: Verify governance schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('SameDayShadowPortfolioReview.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['challengerVersionLocked'] == 'same_day_track_bias_v2_1'
          assert d['prospectiveStartDate'] == '2026-11-01'
          assert d['developmentBaselineDateExcluded'] == '2026-10-31'
          assert d['targetRaces'] == 100
          assert d['qualityChecks']['formal10minEvidenceRequired'] is True
          assert d['qualityChecks']['prospectiveOnly'] is True
          assert d['qualityChecks']['automaticPromotionAllowed'] is False
          print('prospective review verified:', d['racesObserved'], '/', d['targetRaces'])
          PY

      - name: Publish review when changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- SameDayShadowPortfolioReview.json)" ]; then
            echo 'No cumulative review change.'
            exit 0
          fi
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add SameDayShadowPortfolioReview.json
          git commit -m 'Update Same-Day V2.1 prospective review'
          git pull --rebase origin main
          git push origin HEAD:main
