name: KeibaAI Aligned Daily Research

# Research-only retrospective diagnostics from the already-verified formal audit.
# Never fetch racing pages, replay predictions, mutate frozen T-10 records,
# tune V1 thresholds, place bets, or activate research beta.
on:
  pull_request:
    paths:
      - 'production/aligned_daily_research.py'
      - 'production/test_aligned_daily_research.py'
      - 'production/no_current_odds_shadow.py'
      - 'production/evaluate_no_current_odds_shadow.py'
      - 'production/test_no_current_odds_shadow.py'
      - 'production/parallel_prediction_research.py'
      - 'production/test_parallel_prediction_research.py'
      - '.github/workflows/keibaai-aligned-research-daily.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-aligned-research-daily.yml'
      - 'production/aligned_daily_research.py'
      - 'production/test_aligned_daily_research.py'
      - 'production/inspect_frozen_win_probabilities.py'
      - 'production/test_inspect_frozen_win_probabilities.py'
      - 'production/parallel_prediction_research.py'
      - 'production/test_parallel_prediction_research.py'
      - 'production/evaluate_market_shrink_shadow.py'
      - 'research/model_candidates/no_current_odds_v1/metadata.json'
  workflow_dispatch:
  schedule:
    # 21:15 JST every day (12:15 UTC), after the daytime result/settlement jobs.
    - cron: '15 12 * * *'
  workflow_run:
    # Catch up once the strict audit has refreshed after late settlements.
    workflows: ['KeibaAI Aligned Audit Night Catch-up']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: keibaai-aligned-research-daily
  cancel-in-progress: true

jobs:
  research:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           (github.event.workflow_run.event == 'schedule' ||
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_run') &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    name: Validate frozen research inputs and publish H1-H4 daily diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout event commit (PR checks must exercise proposed code)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify offline research contract and safety
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile production/aligned_daily_research.py production/test_aligned_daily_research.py
          python production/test_aligned_daily_research.py -v
      - name: Inspect frozen horse-level probabilities without touching model or beta
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile production/inspect_frozen_win_probabilities.py production/test_inspect_frozen_win_probabilities.py
          python production/test_inspect_frozen_win_probabilities.py -v
          python production/test_evaluate_market_shrink_shadow.py -v
          python production/test_parallel_prediction_research.py -v
          python -m py_compile production/no_current_odds_shadow.py production/evaluate_no_current_odds_shadow.py production/test_no_current_odds_shadow.py
          python production/test_no_current_odds_shadow.py -v
          # Quality-limited, descriptive data may be printed without weakening
          # the separate H1-H4 full-cohort integrity gate below.
          python production/inspect_frozen_win_probabilities.py
      - name: Rebuild from current verified audit and publish only research reports
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            # The script fails closed on stale, failed, inconsistent, or
            # nonfrozen cohorts and never writes a misleading report.
            python -u production/aligned_daily_research.py
            python -u production/parallel_prediction_research.py
            python -u production/evaluate_no_current_odds_shadow.py
            git add -f -- research/AlignedDailyResearch.json research/AlignedDailyResearch.md research/ParallelPredictionResearch.json research/ParallelPredictionResearch.md research/NoCurrentOddsForwardReview.json research/NoCurrentOddsForwardReview.md
            if git diff --cached --quiet; then
              echo 'ALIGNED_RESEARCH_UNCHANGED: source material unchanged'
              exit 0
            fi
            git commit -m 'Publish verified aligned daily H1-H4 research diagnostics'
            if git push origin HEAD:main; then
              echo 'ALIGNED_DAILY_RESEARCH_PUBLISHED'
              exit 0
            fi
            echo "::warning::Main advanced during research publication; revalidate latest audit (attempt $attempt)"
            sleep $((attempt * 2))
          done
          echo '::error::Aligned research report publication exhausted retries.' >&2
          exit 1
