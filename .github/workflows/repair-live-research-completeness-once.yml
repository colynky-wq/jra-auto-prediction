name: One-off live research completeness repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-live-research-completeness-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'
      - name: Apply reviewed completeness repair
        run: python .github/scripts/repair_live_research_completeness.py
      - name: Run regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile production/all_bet_runtime.py production/triple_research_runtime.py production/live_recording_resume.py production/resilient_live_entrypoint.py production/live_monitor_topk_publish.py production/test_live_recording_resume.py
          python production/test_live_recording_resume.py
          python production/test_bet_research_data.py
          python production/test_wide_axis_rules.py
          python production/smoke_topk_runtime.py
      - name: Publish repair
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add production/all_bet_runtime.py production/triple_research_runtime.py production/live_recording_resume.py production/resilient_live_entrypoint.py production/live_monitor_topk_publish.py production/test_live_recording_resume.py
          git commit -m 'Require complete live research capture before resume'
          git pull --rebase origin main
          git push origin HEAD:main
