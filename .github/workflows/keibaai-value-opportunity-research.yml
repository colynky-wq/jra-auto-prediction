name: KeibaAI Value Opportunity Research

on:
  push:
    branches:
      - research/wide-budget-model-v1
    paths:
      - .github/workflows/keibaai-value-opportunity-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  value-opportunity-research:
    name: Validate value-oriented opportunity score
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt

      - name: Compile research code
        run: |
          python -m py_compile production/research_race_signals.py
          python -m py_compile production/research_value_opportunity.py

      - name: Run leakage-safe value research
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/research_value_opportunity.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-value-opportunity-research
          path: value_opportunity_artifacts/
          if-no-files-found: error
          retention-days: 14
