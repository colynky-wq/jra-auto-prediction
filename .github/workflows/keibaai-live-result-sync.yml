name: KeibaAI Live Result Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/keibaai-live-result-sync.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JST date YYYYMMDD. Leave blank to use today.'
        required: false
        default: ''
  schedule:
    # Every 5 minutes from 09:00 through 17:59 JST.
    # On non-race/stale-data days the scripts exit without meaningful changes.
    - cron: '*/5 0-8 * * *'

permissions:
  contents: write

concurrency:
  group: keibaai-live-result-sync
  cancel-in-progress: false

jobs:
  sync-results:
    name: Publish results and forward validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize latest main before building
        shell: bash
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'

      - name: Compile result and validation publishers
        run: |
          python -m py_compile production/build_result_data_live.py
          python -m py_compile production/build_performance_data.py
          python -m py_compile production/wide_forward_validation.py
          python -m py_compile production/wide_validation_summary.py
          python -m py_compile production/ticket_plan_shadow.py
          python -m py_compile production/wide_axis_rules.py
          python -m py_compile production/wide_axis_shadow.py

      - name: Build app ResultData
        env:
          KEIBAAI_RESULT_DATE: ${{ github.event.inputs.target_date || '' }}
          KEIBAAI_RESULT_DELAY_MINUTES: '5'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/build_result_data_live.py

      - name: Build app PerformanceData
        run: python production/build_performance_data.py

      - name: Join frozen Wide snapshots with final payouts
        env:
          KEIBAAI_WIDE_VALIDATE_DATE: ${{ github.event.inputs.target_date || '' }}
        run: python production/wide_forward_validation.py

      - name: Rebuild cumulative Wide validation summary
        run: python production/wide_validation_summary.py

      - name: Evaluate preregistered ticket-plan rules in shadow mode
        run: python production/ticket_plan_shadow.py

      - name: Evaluate the frozen new Wide-axis rule separately
        run: python production/wide_axis_shadow.py

      - name: Join frozen Trio and Trifecta research records separately
        continue-on-error: true
        run: python production/evaluate_triple_forward.py

      - name: Commit results and validation when changed
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- ResultData.json PerformanceData.json reports)" ]; then
            echo 'No result/performance/validation changes to publish.'
            exit 0
          fi

          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add ResultData.json PerformanceData.json reports
          git commit -m "Update KeibaAI results and forward validation"

          if ! git push origin HEAD:main; then
            echo 'Main moved while this run was building; rebasing once and retrying.'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
