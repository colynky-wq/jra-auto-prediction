name: KeibaAI Formal T-10 Review Live Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'production/formal_10min_evidence.py'
      - 'production/portfolio_review_100.py'
      - 'production/portfolio_review_100_diagnostics.py'
      - 'production/refresh_portfolio_review_live.py'
      - 'production/aligned_portfolio_review.py'
      # Trigger a fresh, read-only aligned audit as soon as confirmed results land.
      - 'ResultData.json'
      - 'reports/**/ResultData.json'
      - 'reports/**/WideValidation.json'
      - 'production/test_aligned_portfolio_review.py'
      - 'production/ALIGNED_PORTFOLIO_PROTOCOL.json'
      - 'production/portfolio_shadow_v2.py'
      - 'production/test_portfolio_shadow_v2.py'
      - 'production/PORTFOLIO_SHADOW_V2.md'
      - 'production/test_formal_10min_evidence.py'
      - 'production/test_portfolio_review_100.py'
      - 'production/test_portfolio_review_100_diagnostics.py'
      - 'production/test_refresh_portfolio_review_live.py'
      - '.github/workflows/keibaai-formal-review-live.yml'
  schedule:
    # 09:00-17:59 JST on Sat/Sun/Mon. Formal T-10 sidecars appear during racing,
    # and the app polls the strict review independently of live prediction writes.
    - cron: '*/5 0-8 * * 0,1,6'

permissions:
  contents: write

concurrency:
  group: keibaai-formal-review-live
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install offline evidence validation dependencies
        run: pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Publish aligned audit independently of legacy projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            audit_failed=0
            python production/aligned_portfolio_review.py || audit_failed=1
            if [ "$audit_failed" -ne 0 ]; then
              # A nonzero audit may publish only an explicit blocked projection.
              python -c 'import json; d=json.load(open("AlignedPortfolioReview.json")); assert d["projectionState"]=="failed" and d["betaDecision"]["eligibleForResearchBeta"] is False'
              echo '::warning::Aligned audit failed; publishing the blocked state before legacy work.'
            fi
            git add -f AlignedPortfolioReview.json AlignedPortfolioReview.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish KeibaAI aligned audit state'
            if git push origin HEAD:main; then exit 0; fi
            echo 'Main advanced; rebuild the aligned audit from its current inputs.'
            sleep $((attempt * 2))
          done
          echo 'Unable to publish aligned audit state after bounded retries.' >&2
          exit 1

      - name: Verify strict formal review refresh, v2 shadow, and frozen 100R diagnostics
        run: |
          python -m py_compile production/formal_10min_evidence.py production/portfolio_review_100.py production/portfolio_review_100_diagnostics.py production/refresh_portfolio_review_live.py production/portfolio_shadow.py production/portfolio_shadow_v2.py
          python production/test_formal_10min_evidence.py
          python production/test_portfolio_review_100.py
          python production/test_portfolio_review_100_diagnostics.py
          python production/test_refresh_portfolio_review_live.py
          python production/test_aligned_portfolio_review.py
          python production/test_portfolio_shadow.py
          python production/test_portfolio_shadow_v2.py

      - name: Refresh review, freeze v2 shadow, and publish material diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python production/refresh_portfolio_review_live.py
            python production/portfolio_review_100_diagnostics.py
            python production/portfolio_shadow_v2.py

            if [ -z "$(git status --porcelain -- PortfolioReview100.json PortfolioReview100Diagnostics.json PortfolioReview100Diagnostics.md PortfolioShadowV2.json reports/*/PortfolioShadowV2.json)" ]; then
              echo 'No material formal T-10 review, V2 shadow, or frozen 100R diagnostic change.'
              exit 0
            fi

            git add -f PortfolioReview100.json PortfolioShadowV2.json
            if [ -f PortfolioReview100Diagnostics.json ]; then
              git add -f PortfolioReview100Diagnostics.json
            fi
            if [ -f PortfolioReview100Diagnostics.md ]; then
              git add -f PortfolioReview100Diagnostics.md
            fi
            for path in reports/*/PortfolioShadowV2.json; do
              [ -e "$path" ] || continue
              git add -f "$path"
            done
            git commit -m 'Refresh KeibaAI formal T-10 review, V2 shadow, and diagnostics'

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; rebuilding from latest main (attempt ${attempt}/4)."
            sleep $((attempt * 2))
          done

          echo 'Unable to publish formal review after bounded retries.' >&2
          exit 1
