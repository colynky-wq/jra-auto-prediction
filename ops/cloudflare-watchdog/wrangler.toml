name = "keibaai-live-start-watchdog"
main = "worker.mjs"
compatibility_date = "2026-11-24"
workers_dev = false
preview_urls = false

[vars]
ENABLE_DISPATCH = "false"

[triggers]
# UTC Friday/Saturday/Sunday 22:00-23:45 = JST Saturday/Sunday/Monday 07:00-08:45.
crons = ["0,15,30,45 22-23 * * FRI,SAT,SUN"]
