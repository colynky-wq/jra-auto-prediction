name: KeibaAI One-Race Dry Run

on:
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Race date YYYYMMDD'
        required: false
        default: '20261011'
      test_race_id:
        description: '12-digit race ID'
        required: false
        default: '202608040406'

permissions:
  contents: read

jobs:
  dry-run:
    name: Run one race through fixed KeibaAI
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: pip install -r production/requirements.txt

      - name: Install dry-run network dependencies
        run: pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Run one-race AI dry run
        env:
          KEIBAAI_DRYRUN_DATE: ${{ inputs.test_date }}
          KEIBAAI_DRYRUN_RACE_ID: ${{ inputs.test_race_id }}
        run: python production/run_one_race_dry_run.py
