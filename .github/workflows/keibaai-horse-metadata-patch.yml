name: KeibaAI Horse Metadata Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-horse-metadata-patch.yml'

permissions:
  contents: write

concurrency:
  group: keibaai-horse-metadata-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch prediction payload and iOS display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              return p, p.read_text(encoding='utf-8')

          def save(p, text):
              p.write_text(text, encoding='utf-8')

          def insert_after_stripped(path, needle, block):
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines()
              hits = [i for i, line in enumerate(lines) if line.strip() == needle]
              if len(hits) != 1:
                  raise SystemExit(f'{path}: {needle!r} expected once, got {len(hits)}')
              i = hits[0]
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              additions = [indent + line if line else '' for line in block]
              lines[i + 1:i + 1] = additions
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Live prediction DataFrame already has these pre-race values; carry them to the publisher.
          insert_after_stripped(
              'production/live_monitor_topk.py',
              '"馬キー": pred["馬キー"].astype(str),',
              [
                  '"騎手": pred["騎手"].astype(str),',
                  '"斤量": pred["斤量"].astype(float),',
                  '"人気": pred["人気"].astype(float),',
                  '"馬体重": pred["馬体重"].astype(float),',
                  '"増減": pred["増減"].astype(float),',
              ],
          )

          # JSON-safe optional values: unpublished body weight must become null, never NaN.
          p, text = load('production/live_monitor_topk_publish.py')
          marker = '\ndef _target_date_text() -> str:\n'
          if text.count(marker) != 1:
              raise SystemExit('live_monitor_topk_publish.py: target-date marker mismatch')
          helpers = '''\ndef _optional_text(value) -> str | None:\n    if pd.isna(value):\n        return None\n    text = str(value).strip()\n    return text or None\n\n\ndef _optional_number(value, digits: int = 1) -> float | None:\n    if pd.isna(value):\n        return None\n    return round(float(value), digits)\n\n\ndef _optional_int(value) -> int | None:\n    if pd.isna(value):\n        return None\n    return int(value)\n\n'''
          text = text.replace(marker, helpers + marker, 1)
          save(p, text)

          insert_after_stripped(
              'production/live_monitor_topk_publish.py',
              '"horseKey": str(row["馬キー"]),',
              [
                  '"jockey": _optional_text(row.get("騎手")),',
                  '"carriedWeight": _optional_number(row.get("斤量"), 1),',
                  '"popularity": _optional_int(row.get("人気")),',
                  '"bodyWeight": _optional_int(row.get("馬体重")),',
                  '"bodyWeightChange": _optional_int(row.get("増減")),',
              ],
          )

          # Keep old saved RaceData decodable by making every newly displayed field optional.
          insert_after_stripped(
              'ios/KeibaAI/KeibaAI/KeibaAIModels.swift',
              'var horseKey: String? = nil',
              [
                  '',
                  '// 発走前のJRA出馬表から取得。旧RaceDataとの互換性のためOptional。',
                  'var jockey: String? = nil',
                  'var carriedWeight: Double? = nil',
                  'var popularity: Int? = nil',
                  'var bodyWeight: Int? = nil',
                  'var bodyWeightChange: Int? = nil',
              ],
          )

          # Only edit the horse-card section in the large Swift view.
          path = 'ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift'
          p, text = load(path)
          start = text.index('private struct KeibaAIHorseCard: View {')
          end = text.index('private struct KeibaAIValueCell: View {', start)
          section = text[start:end]

          body_marker = '\n    var body: some View {'
          if section.count(body_marker) != 1:
              raise SystemExit('HorseCard body marker mismatch')
          computed = '''\n    private var bodyWeightText: String {\n        guard let weight = horse.bodyWeight else { return "馬体重 未発表" }\n        guard let change = horse.bodyWeightChange else { return "馬体重 \\(weight)kg" }\n        let diff = change > 0 ? "+\\(change)" : "\\(change)"\n        return "馬体重 \\(weight)kg（\\(diff)）"\n    }\n\n    private var carriedWeightText: String {\n        guard let value = horse.carriedWeight else { return "斤量 --" }\n        if value.rounded() == value { return "斤量 \\(Int(value))kg" }\n        return String(format: "斤量 %.1fkg", value)\n    }\n'''
          section = section.replace(body_marker, computed + body_marker, 1)

          name_at = section.index('Text(horse.name)')
          research_at = section.index('                            HStack(spacing: 5) {', name_at)
          metadata = '''                            Text(horse.jockey.map { "\\($0) 騎手" } ?? "騎手 --")\n                                .font(.caption)\n                                .foregroundStyle(.secondary)\n                                .lineLimit(1)\n\n                            HStack(spacing: 8) {\n                                Text(bodyWeightText)\n                                Text(carriedWeightText)\n                            }\n                            .font(.caption2.monospacedDigit())\n                            .foregroundStyle(.secondary)\n                            .lineLimit(1)\n\n'''
          section = section[:research_at] + metadata + section[research_at:]

          old_odds_label = '''                    Text("単勝")\n                        .font(.caption2)\n                        .foregroundStyle(.secondary)'''
          new_odds_label = '''                    Text(horse.popularity.map { "\\($0)人気・単勝" } ?? "単勝")\n                        .font(.caption2)\n                        .foregroundStyle(.secondary)'''
          if section.count(old_odds_label) != 1:
              raise SystemExit(f'HorseCard odds-label mismatch: {section.count(old_odds_label)}')
          section = section.replace(old_odds_label, new_odds_label, 1)

          text = text[:start] + section + text[end:]
          save(p, text)
          PY

      - name: Validate patched source
        shell: bash
        run: |
          python -m py_compile production/live_monitor_topk.py production/live_monitor_topk_publish.py
          grep -q 'bodyWeightChange' ios/KeibaAI/KeibaAI/KeibaAIModels.swift
          grep -q '馬体重 未発表' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift
          grep -q 'popularity.map' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift
          git diff --check

      - name: Commit source changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          rm .github/workflows/keibaai-horse-metadata-patch.yml
          git add production/live_monitor_topk.py production/live_monitor_topk_publish.py \
            ios/KeibaAI/KeibaAI/KeibaAIModels.swift ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift \
            .github/workflows/keibaai-horse-metadata-patch.yml
          git commit -m 'Show jockey weight popularity in KeibaAI'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
