name: Temporary wide phone layout patch

on:
  push:
    branches:
      - fix/wide-phone-layout-20261026

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/wide-phone-layout-20261026
      - name: Apply source and UI-test patch
        run: |
          python3 ios/tests/apply_wide_phone_layout_fix.py
          git diff --check
          git diff -- ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift ios/tests/PhoneNavigationUITests.swift
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift ios/tests/PhoneNavigationUITests.swift
          git commit -m 'Apply wide phone layout fix'
          git push origin HEAD:fix/wide-phone-layout-20261026
