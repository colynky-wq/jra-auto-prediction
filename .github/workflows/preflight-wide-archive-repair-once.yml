name: One-off Wide archive preflight repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-wide-archive-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'
      - name: Patch multi-race Wide archive recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('production/build_signal_data_v2.py')
          text=path.read_text()
          old='''        path = REPORTS_DIR / day / "wide_odds" / (rid + ".json")
                  if path.exists():
                      saved = json.loads(path.read_text(encoding="utf-8"))
                      if (saved.get("raceID") != rid or saved.get("raceDate") != race.get("raceDate")
                              or saved.get("frozenAtFirstSuccessfulCapture") is not True):
                          raise ValueError("saved Wide snapshot identity is inconsistent: " + str(path))
              # Official post time may move after the immutable first Wide snapshot.
              # raceID/date plus venue/raceNumber identify the race; startTime drift is allowed.
              for key in ("venue", "raceNumber"):
                  frozen = saved.get(key)
                  current = race.get(key)
                  if frozen not in (None, "") and current not in (None, "") and frozen != current:
                      raise ValueError("saved Wide snapshot identity is inconsistent: " + str(path))
              out[rid] = saved
          '''
          new='''        path = REPORTS_DIR / day / "wide_odds" / (rid + ".json")
                  if not path.exists():
                      continue
                  saved = json.loads(path.read_text(encoding="utf-8"))
                  if (saved.get("raceID") != rid or saved.get("raceDate") != race.get("raceDate")
                          or saved.get("frozenAtFirstSuccessfulCapture") is not True):
                      raise ValueError("saved Wide snapshot identity is inconsistent: " + str(path))
                  # Official post time may move after the immutable first Wide snapshot.
                  # raceID/date plus venue/raceNumber identify the race; startTime drift is allowed.
                  for key in ("venue", "raceNumber"):
                      frozen = saved.get(key)
                      current = race.get(key)
                      if frozen not in (None, "") and current not in (None, "") and frozen != current:
                          raise ValueError("saved Wide snapshot identity is inconsistent: " + str(path))
                  out[rid] = saved
          '''
          if text.count(old) != 1:
              raise SystemExit('Wide archive recovery anchor mismatch')
          path.write_text(text.replace(old,new,1))

          path=Path('production/test_live_recording_resume.py')
          text=path.read_text()
          marker='''    def test_wide_archive_identity_allows_later_official_post_time_update(self):
          '''
          addition='''    def test_wide_archive_fallback_recovers_all_saved_races_when_cache_is_empty(self):
                  import build_signal_data_v2 as v2
                  with tempfile.TemporaryDirectory() as t:
                      root=Path(t);races=[];expected=set()
                      for number,rid in ((10,'202605040810'),(11,'202605040811')):
                          race={'raceID':rid,'raceDate':'2026-10-24','venue':'東京',
                                'raceNumber':number,'startTime':'15:00'}
                          saved={**race,'frozenAtFirstSuccessfulCapture':True,'pairs':[]}
                          p=root/'reports/20261024/wide_odds'/f'{rid}.json'
                          p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(saved))
                          races.append(race);expected.add(rid)
                      # A scheduled race without an archive must not break recovery of the others.
                      races.append({'raceID':'202605040812','raceDate':'2026-10-24','venue':'東京',
                                    'raceNumber':12,'startTime':'16:30'})
                      with patch.object(v2,'REPORTS_DIR',root/'reports'),\
                              patch.object(v2.wide,'_load_payload',return_value={'snapshots':[]}):
                          got=v2._load_wide_by_race(races)
                      self.assertEqual(set(got),expected)
                      self.assertEqual(got['202605040810']['raceNumber'],10)
                      self.assertEqual(got['202605040811']['raceNumber'],11)

          '''
          if 'test_wide_archive_fallback_recovers_all_saved_races_when_cache_is_empty' in text:
              raise SystemExit('multi-race archive test already present')
          if text.count(marker) != 1:
              raise SystemExit('test insertion anchor mismatch')
          path.write_text(text.replace(marker,addition+marker,1))
          PY
      - name: Run preflight regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile production/build_signal_data_v2.py production/test_live_recording_resume.py
          python production/test_live_recording_resume.py
          python production/test_wide_axis_rules.py
          python production/test_bet_research_data.py
      - name: Publish repair
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add production/build_signal_data_v2.py production/test_live_recording_resume.py
          if git diff --cached --quiet; then
            echo 'No repair changes.'
            exit 0
          fi
          git commit -m 'Recover every saved Wide archive when cache is empty'
          git pull --rebase origin main
          git push origin HEAD:main
