name: KeibaAI Bet Performance Summary

on:
  pull_request:
    paths:
      - 'production/build_bet_performance_summary.py'
      - 'production/test_bet_performance_summary.py'
      - '.github/workflows/keibaai-bet-performance-summary.yml'
  push:
    branches: [main]
    paths:
      - 'production/build_bet_performance_summary.py'
      - 'production/test_bet_performance_summary.py'
      - '.github/workflows/keibaai-bet-performance-summary.yml'
  schedule:
    # 09:00-18:59 JST on Sat/Sun/Mon. The result sync updates source data during racing.
    - cron: '*/10 0-9 * * 0,1,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keibaai-bet-performance-summary
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify material-change aggregation
        run: |
          python -m py_compile production/build_bet_performance_summary.py
          python production/test_bet_performance_summary.py
      - name: Build per-bet performance summary
        run: python production/build_bet_performance_summary.py
      - name: Validate summary contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('BetPerformanceSummary.json',encoding='utf-8'))
          assert p['status']=='research_evaluation_only'
          assert len(p['betTypes'])==10
          for x in p['betTypes']:
              assert x['stakeYen'] >= 0 and x['returnYen'] >= 0
              if x['candidateTickets']:
                  assert 0 <= x['ticketHitRatePct'] <= 100
              if x['stakeYen']:
                  assert x['returnRatePct'] >= 0
          print('BET_PERFORMANCE_SUMMARY_OK')
          PY
      - name: Publish summary when material metrics changed
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'

          if git diff --quiet -- BetPerformanceSummary.json; then
            echo 'No material bet-performance change.'
            exit 0
          fi

          for attempt in 1 2 3 4; do
            git add BetPerformanceSummary.json
            git commit -m 'Update bet performance summary' || true
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python production/build_bet_performance_summary.py
            if git diff --quiet -- BetPerformanceSummary.json; then
              echo 'Concurrent update already contains equivalent summary.'
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Unable to publish bet performance summary after bounded retries.' >&2
          exit 1
