name: KeibaAI Longshot V8 Contextual Residual Research
on:
  pull_request:
    paths:
      - 'production/research_longshot_top3_v8.py'
      - '.github/workflows/keibaai-longshot-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r production/requirements.txt
      - run: python production/research_longshot_top3_v8.py --self-test
      - name: Evaluate frozen V2 against contextual shrinkage
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python production/research_longshot_top3_v8.py
      - uses: actions/upload-artifact@v4
        with:
          name: longshot-v8-contextual-residual-research
          path: research/model_candidates/longshot_top3_v8/
