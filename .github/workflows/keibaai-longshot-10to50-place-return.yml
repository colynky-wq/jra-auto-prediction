name: KeibaAI Longshot 10-to-50 Place Return Diagnostics

# Historical, optional and read-only. Payouts are archived actual place
# returns from available 2026 races; no odds-based payout estimates.
on:
  pull_request:
    paths:
      - 'production/research_longshot_10to50_place_return.py'
      - 'production/test_research_longshot_10to50_place_return.py'
      - '.github/workflows/keibaai-longshot-10to50-place-return.yml'
  push:
    branches: [main]
    paths:
      - 'production/research_longshot_10to50_place_return.py'
      - 'production/test_research_longshot_10to50_place_return.py'
      - '.github/workflows/keibaai-longshot-10to50-place-return.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keibaai-longshot-10to50-place-return
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - run: pip install -r production/requirements.txt
      - name: Test source integrity and no invented ROI or post-hoc predictions
        run: |
          python -m py_compile production/research_longshot_10to50_place_return.py production/test_research_longshot_10to50_place_return.py
          python -m unittest discover -s production -p 'test_research_longshot_10to50_place_return.py' -v
      - name: Retrospective 2025/2026 accuracy and 2026 archived place payout analysis
        if: github.event_name != 'pull_request'
        env:
          OMP_NUM_THREADS: '2'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -u production/research_longshot_10to50_place_return.py
      - name: Audit model provenance and no changes to production
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/Longshot10to50PlaceReturnReview.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          model=Path('research/model_candidates/longshot_top3_v1/longshot_top3_residual.txt')
          assert d['modelSha256']==hashlib.sha256(model.read_bytes()).hexdigest()
          assert d['status']=='retrospective_exploratory_not_bettable'
          assert d['researchOnly'] is True
          assert d['candidatePromotionApproved'] is False
          assert d['formalPredictionAIChanged'] is False
          assert d['autoBetEnabled'] is False
          assert d['cohortQuality2025And2026']['2025']['entire10to50']['horseRows']>1000
          assert d['cohortQuality2025And2026']['2026']['entire10to50']['horseRows']>1000
          pay=d['2026PlacePayoutEvidence']
          assert pay['archivedRacePayoutFiles']>100
          assert pay['noInferredOrSynthesizedPayouts'] is True
          assert sum(pay['excludedCounts'].values()) + pay['eligibleCompleteMatching10to50Races']==pay['archivedRacePayoutFiles']
          print('PLACE_RETURN_DIAGNOSTIC_VERIFIED', pay['archivedRacePayoutFiles'],
                pay['eligibleCompleteMatching10to50Races'],
                pay['grossReturnSimulationByMethod'])
          PY
      - name: Save research artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: longshot-10to50-place-return-research
          path: |
            research/Longshot10to50PlaceReturnReview.json
            research/Longshot10to50PlaceReturnReview.md
          retention-days: 30
          if-no-files-found: error
      - name: Publish only isolated research results
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add -f research/Longshot10to50PlaceReturnReview.json research/Longshot10to50PlaceReturnReview.md
          if git diff --cached --quiet; then
            echo 'RESEARCH_RETURN_REPORT_UNCHANGED'
            exit 0
          fi
          git commit -m 'Publish exploratory 10-50 longshot accuracy and real place payout simulation'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'RESEARCH_RETURN_REPORT_PUBLISHED'
              exit 0
            fi
            sleep $((2*attempt))
          done
          echo '::error::Research artifact not published; uploaded artifact retained' >&2
          exit 1
