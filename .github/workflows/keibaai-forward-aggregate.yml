name: KeibaAI Forward Result Aggregate

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JST date YYYYMMDD. Leave blank to use today.'
        required: false
        default: ''
  schedule:
    # 20:00 JST every day. On non-JRA/stale RaceData days the script safely skips.
    - cron: '0 11 * * *'

permissions:
  contents: write

concurrency:
  group: keibaai-forward-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    name: Aggregate forward predictions and results
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: pip install -r production/requirements.txt

      - name: Install aggregation dependencies
        run: pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'

      - name: Aggregate forward results
        env:
          KEIBAAI_AGGREGATE_DATE: ${{ inputs.target_date }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/run_forward_aggregate_v2.py

      - name: Commit reports when changed
        shell: bash
        run: |
          if git diff --quiet -- reports; then
            echo 'No report changes to commit.'
            exit 0
          fi

          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add reports
          git commit -m "Update KeibaAI forward result reports"
          git push
