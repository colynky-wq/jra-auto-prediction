name: KeibaAI Scratch Handling Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-scratch-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Make official active entrants authoritative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '''    active = set(odds["馬番"].astype(int))
              entries = entries.loc[entries["馬番"].astype(int).isin(active)].copy()
              entries = entries.sort_values("馬番").reset_index(drop=True)

              if len(entries) != len(odds):
                  raise RuntimeError(f"entry/odds count mismatch: {len(entries)} / {len(odds)}")'''

          new = '''    # JRA's official current entry table is authoritative for scratches.
              # Some odds feeds can temporarily retain a withdrawn horse (for example
              # with a sentinel price), which must not block the prediction for the
              # remaining active runners.
              official_active = set(entries["馬番"].astype(int))
              odds_numbers = set(odds["馬番"].astype(int))
              ignored_odds = sorted(odds_numbers - official_active)
              if ignored_odds:
                  print("Ignoring odds for non-active JRA entrants:", ignored_odds)

              odds = odds.loc[odds["馬番"].astype(int).isin(official_active)].copy()
              odds = odds.sort_values("馬番").reset_index(drop=True)
              active = set(odds["馬番"].astype(int))
              entries = entries.loc[entries["馬番"].astype(int).isin(active)].copy()
              entries = entries.sort_values("馬番").reset_index(drop=True)

              if len(entries) != len(odds) or active != official_active:
                  missing_odds = sorted(official_active - active)
                  raise RuntimeError(
                      f"active entry/odds mismatch: entries={len(official_active)} "
                      f"odds={len(odds)} missing_odds={missing_odds}"
                  )'''

          for path in ['production/live_monitor_dry_run.py', 'production/live_monitor_topk.py']:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one alignment block, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate patched runtime
        shell: bash
        run: |
          python -m py_compile production/live_monitor_dry_run.py production/live_monitor_topk.py
          grep -q 'Ignoring odds for non-active JRA entrants' production/live_monitor_topk.py
          grep -q 'active entry/odds mismatch' production/live_monitor_dry_run.py

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          rm .github/workflows/keibaai-scratch-fix.yml
          git add production/live_monitor_dry_run.py production/live_monitor_topk.py .github/workflows/keibaai-scratch-fix.yml
          git commit -m 'Handle scratched horses in live prediction'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
