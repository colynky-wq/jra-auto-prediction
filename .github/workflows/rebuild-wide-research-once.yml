name: One-off Wide research rebuild

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-wide-research-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'

      - name: Test and rebuild bet research data
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python production/test_bet_research_data.py
          python production/build_bet_research_data.py

      - name: Verify Wide invalids are cleared
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('BetResearchData.json').read_text())
          wide=next(x for x in data['catalog'] if x['id']=='wide')
          invalid=[r for r in data['races'] if r.get('betType')=='wide' and r.get('status')=='invalid']
          print('Wide cumulative:', json.dumps(wide['cumulative'], ensure_ascii=False))
          print('Wide invalid rows:', len(invalid))
          if invalid:
              print('First invalid:', json.dumps(invalid[0], ensure_ascii=False))
              raise SystemExit('Wide invalid rows remain after rebuild')
          if wide['cumulative'].get('invalid') != 0:
              raise SystemExit('Wide cumulative invalid is not zero')
          current=[r for r in data['races'] if r.get('betType')=='wide' and r.get('raceDate')=='2026-10-24' and r.get('hasRecord')]
          if not current:
              raise SystemExit('No current-date Wide records found')
          broken=[r for r in current if not r.get('venue') or r.get('raceNumber') is None or not r.get('candidates')]
          print('2026-10-24 Wide recorded rows:', len(current), 'metadata/candidate failures:', len(broken))
          if broken:
              print('First broken:', json.dumps(broken[0], ensure_ascii=False))
              raise SystemExit('Wide metadata/candidates remain broken')
          PY

      - name: Publish rebuilt BetResearchData
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add BetResearchData.json
          if git diff --cached --quiet; then
            echo 'No BetResearchData changes to publish.'
            exit 0
          fi
          git commit -m 'Rebuild Wide bet research data'
          git pull --rebase origin main
          git push origin HEAD:main
