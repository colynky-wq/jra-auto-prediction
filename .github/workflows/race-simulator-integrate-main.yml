name: RaceSimulator safe main integration

on:
  push:
    branches:
      - feature/race-simulator-v0-1
    paths:
      - '.github/workflows/race-simulator-integrate-main.yml'

permissions:
  contents: write

concurrency:
  group: race-simulator-main-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build resolved merge on latest main
        shell: bash
        run: |
          set -euo pipefail
          FEATURE_HEAD="$(git rev-parse HEAD)"
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"
          echo "feature=$FEATURE_HEAD"
          echo "main=$MAIN_HEAD"
          cp ios/KeibaAI/KeibaAI/KeibaAIApp.swift /tmp/feature_KeibaAIApp.swift
          git checkout -B race-simulator-main-base "$MAIN_HEAD"
          git checkout "$FEATURE_HEAD" -- \
            .github/workflows/race-simulator-ci.yml \
            .github/workflows/race-simulator-integrate-main.yml \
            docs/RaceSimulator_v0.1.md \
            docs/RaceSimulator_v0.1_current_data.md \
            production/build_race_simulation_data.py \
            production/race_metadata_overrides.json \
            production/race_simulator_keibaai_adapter.py \
            production/race_simulator_v01.py \
            production/test_build_race_simulation_data.py \
            production/test_race_simulator_keibaai_adapter.py \
            production/test_race_simulator_v01.py \
            RaceSimulationData.json
          python3 - <<'PY'
          from pathlib import Path

          old = Path('/tmp/feature_KeibaAIApp.swift').read_text(encoding='utf-8')
          marker = '// MARK: - Canonical RaceSimulator JSON'
          if marker not in old:
              raise SystemExit('RaceSimulator marker missing from feature App.swift')
          section = old[old.index(marker):]
          section = section.replace('private struct KeibaAIRaceSimulatorScreen: View {', 'struct KeibaAIRaceSimulatorScreen: View {', 1)
          section = section.replace('Text(race.course).foregroundStyle(.secondary)', 'Text(sim.track ?? race.course).foregroundStyle(.secondary)', 1)
          simulator = 'import SwiftUI\nimport Foundation\nimport Combine\n\n' + section.strip() + '\n'
          Path('ios/KeibaAI/KeibaAI/RaceSimulatorView.swift').write_text(simulator, encoding='utf-8')

          app_path = Path('ios/KeibaAI/KeibaAI/KeibaAIApp.swift')
          app = app_path.read_text(encoding='utf-8')
          needle = 'private struct KeibaAIRootView: View'
          start = app.find(needle)
          if start < 0:
              raise SystemExit('KeibaAIRootView not found in latest main')
          brace = app.find('{', start)
          if brace < 0:
              raise SystemExit('KeibaAIRootView opening brace not found')
          depth = 0
          end = None
          for i in range(brace, len(app)):
              if app[i] == '{':
                  depth += 1
              elif app[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('KeibaAIRootView closing brace not found')
          replacement = '\n'.join([
              'private struct KeibaAIRootView: View {',
              '    var body: some View {',
              '        TabView {',
              '            KeibaAINewDesignView()',
              '                .tabItem { Label("予測AI", systemImage: "sparkles") }',
              '',
              '            KeibaAIRaceSimulatorScreen()',
              '                .tabItem { Label("展開シミュ", systemImage: "figure.run") }',
              '        }',
              '    }',
              '}',
          ])
          app_path.write_text(app[:start] + replacement + app[end:], encoding='utf-8')

          pbx_path = Path('ios/KeibaAI/KeibaAI.xcodeproj/project.pbxproj')
          pbx = pbx_path.read_text(encoding='utf-8')
          build_id = 'A17ACE510000000000000001'
          ref_id = 'A17ACE510000000000000002'
          if build_id in pbx or ref_id in pbx:
              raise SystemExit('RaceSimulator Xcode IDs unexpectedly already exist')
          pbx = pbx.replace('/* Begin PBXBuildFile section */\n', '/* Begin PBXBuildFile section */\n\t\t' + build_id + ' /* RaceSimulatorView.swift in Sources */ = {isa = PBXBuildFile; fileRef = ' + ref_id + ' /* RaceSimulatorView.swift */; };\n', 1)
          pbx = pbx.replace('/* Begin PBXFileReference section */\n', '/* Begin PBXFileReference section */\n\t\t' + ref_id + ' /* RaceSimulatorView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RaceSimulatorView.swift; sourceTree = "<group>"; };\n', 1)
          group_anchor = '\t\t21C9F967307B46C400A81BC9 /* KeibaAI */ = {\n\t\t\tisa = PBXGroup;\n\t\t\tchildren = (\n'
          if group_anchor not in pbx:
              raise SystemExit('KeibaAI PBXGroup anchor missing')
          pbx = pbx.replace(group_anchor, group_anchor + '\t\t\t\t' + ref_id + ' /* RaceSimulatorView.swift */,\n', 1)
          source_anchor = '\t\t21C9F932307B28F200A81BC9 /* Sources */ = {\n\t\t\tisa = PBXSourcesBuildPhase;\n\t\t\tfiles = (\n'
          if source_anchor not in pbx:
              raise SystemExit('PBXSourcesBuildPhase anchor missing')
          pbx = pbx.replace(source_anchor, source_anchor + '\t\t\t\t' + build_id + ' /* RaceSimulatorView.swift in Sources */,\n', 1)
          pbx_path.write_text(pbx, encoding='utf-8')

          ci_path = Path('.github/workflows/race-simulator-ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          item = "      - 'production/race_metadata_overrides.json'\n"
          if item not in ci:
              anchor = "      - 'production/build_race_simulation_data.py'\n"
              if anchor not in ci:
                  raise SystemExit('RaceSimulator CI path anchor missing')
              ci_path.write_text(ci.replace(anchor, anchor + item, 1), encoding='utf-8')
          PY
          git add -A
          git diff --cached --check
          TREE="$(git write-tree)"
          MERGE_COMMIT="$(printf '%s\n' 'Merge latest main safely into RaceSimulator v0.1' | git commit-tree "$TREE" -p "$FEATURE_HEAD" -p "$MAIN_HEAD")"
          echo "merge_commit=$MERGE_COMMIT"
          git push origin "$MERGE_COMMIT:refs/heads/feature/race-simulator-v0-1"
