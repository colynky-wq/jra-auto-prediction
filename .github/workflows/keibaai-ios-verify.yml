name: KeibaAI iOS Build and Identity
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'production/*bet_research_data.py'
      - 'production/publish_early_racedata.py'
      - 'production/early_prediction_runtime.py'
      - '.github/workflows/keibaai-early-prediction.yml'
      - '.github/workflows/keibaai-ios-verify.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'production/*bet_research_data.py'
      - 'production/publish_early_racedata.py'
      - 'production/early_prediction_runtime.py'
      - '.github/workflows/keibaai-early-prediction.yml'
      - '.github/workflows/keibaai-ios-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify early prediction to RaceData contract
        run: |
          python3 -m py_compile production/publish_early_racedata.py production/early_prediction_runtime.py
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          sample = {
            'schemaVersion': 1,
            'status': 'research_early_snapshot',
            'formalRecommendation': False,
            'raceDate': '2026-10-24',
            'snapshots': {'previous_evening': {'stage':'previous_evening','races':[{
              'raceID':'202605040701','raceDate':'2026-10-24','venue':'東京','raceNumber':1,
              'startTime':'10:05','raceName':'2歳未勝利','horses':[{
                'number':1,'name':'テストホース','odds':3.2,'marketProbability':25.0,
                'aiProbability':30.0,'aiTop2Probability':50.0,'aiTop3Probability':65.0,
                'aiMarketRatio':1.2
              }]
            }]}}
          }
          with tempfile.TemporaryDirectory() as td:
            td=pathlib.Path(td)
            src=td/'EarlyPredictionData.json'; out=td/'RaceData.json'
            src.write_text(json.dumps(sample,ensure_ascii=False),encoding='utf-8')
            subprocess.check_call(['python3','production/publish_early_racedata.py','--input',str(src),'--output',str(out),'--stage','previous_evening'])
            races=json.loads(out.read_text(encoding='utf-8'))
            assert len(races)==1
            race=races[0]; horse=race['horses'][0]
            required_race={'raceID','raceDate','venue','raceNumber','startTime','raceName','course','horses'}
            required_horse={'number','name','odds','marketProbability','aiProbability','aiMarketRatio','expectedIndex'}
            assert required_race <= race.keys(), race
            assert required_horse <= horse.keys(), horse
            assert race['raceDate']=='2026-10-24'
            assert horse['expectedIndex']==96.0
          PY
      - name: Verify Xcode and compile the actual model and identity code
        run: |
          xcodebuild -version
          swiftc -swift-version 5 ios/KeibaAI/KeibaAI/KeibaAIModels.swift ios/KeibaAI/KeibaAI/KeibaAIHorseIdentity.swift ios/tests/ProfileIdentityChecks.swift -o /tmp/keibaai-profile-checks
          /tmp/keibaai-profile-checks
          swiftc -swift-version 5 ios/KeibaAI/KeibaAI/KeibaAIHorseIdentity.swift ios/KeibaAI/KeibaAI/KeibaAIHorseProfiles.swift ios/tests/ProfileStoreChecks.swift -o /tmp/keibaai-store-checks
          /tmp/keibaai-store-checks
          swiftc -swift-version 5 ios/KeibaAI/KeibaAI/KeibaAIRecordingStatusModels.swift ios/tests/RecordingStatusChecks.swift -o /tmp/keibaai-recording-checks
          /tmp/keibaai-recording-checks
      - name: Verify the actual recording refresh store with isolated HTTP responses
        run: |
          python3 ios/tests/build_recording_store_checks.py --source ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift --checks ios/tests/RecordingStatusStoreChecks.swift --output /tmp/KeibaAIRecordingStoreChecks.swift
          swiftc -swift-version 5 -parse-as-library ios/KeibaAI/KeibaAI/KeibaAIRecordingStatusModels.swift /tmp/KeibaAIRecordingStoreChecks.swift -o /tmp/keibaai-recording-store-checks
          /tmp/keibaai-recording-store-checks
      - name: Verify reference ticket budgets and summary refresh
        run: |
          python3 production/test_wide_axis_rules.py --emit-contract /tmp/wide-axis-contract.json
          python3 -m unittest discover -s production -p test_live_bundle_publisher.py
          swiftc -swift-version 5 -parse-as-library ios/KeibaAI/KeibaAI/KeibaAIReferenceTicketModels.swift ios/tests/ReferenceTicketChecks.swift -o /tmp/keibaai-reference-checks
          /tmp/keibaai-reference-checks
      - name: Verify all-bet app contract and the actual refresh store
        run: |
          python3 -m venv /tmp/keibaai-bet-app-venv
          /tmp/keibaai-bet-app-venv/bin/pip install 'beautifulsoup4==4.13.4' pandas requests lxml
          /tmp/keibaai-bet-app-venv/bin/python production/test_bet_research_data.py --emit-contract /tmp/bet-research-contract.json
          swiftc -swift-version 5 -parse-as-library ios/KeibaAI/KeibaAI/KeibaAIBetResearchModels.swift ios/tests/BetResearchChecks.swift -o /tmp/keibaai-bet-research-checks
          /tmp/keibaai-bet-research-checks
      - name: Verify race-day resolution and display regression
        run: python3 ios/tests/test_race_date_display_regression.py
      - name: Build the complete iOS app without signing
        run: |
          xcodebuild -project ios/KeibaAI/KeibaAI.xcodeproj -scheme KeibaAI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/KeibaAI-build CODE_SIGNING_ALLOWED=NO build
      - name: Tap race details and the full guide on iPhone
        run: |
          python3 ios/tests/prepare_phone_ui_tests.py
          phone_test_udid=$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          devices=[d for runtime,rows in data['devices'].items() if 'iOS-27' in runtime for d in rows if d['name'].startswith('iPhone') and d['isAvailable']]
          assert devices, 'iOS 27 iPhone simulator is required'
          devices.sort(key=lambda d:(d['name']!='iPhone 18 Pro',d['name']))
          print(devices[0]['udid'])
          PY
          )
          xcrun simctl boot "$phone_test_udid" || true
          xcrun simctl bootstatus "$phone_test_udid" -b
          xcodebuild -project ios/KeibaAI/KeibaAI.xcodeproj -scheme KeibaAIPhoneUITests -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$phone_test_udid" -parallel-testing-enabled NO -derivedDataPath /tmp/KeibaAI-phone-build -resultBundlePath /tmp/KeibaAI-phone-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Export iPhone screenshots for visual review
        if: always()
        run: |
          if [ -d /tmp/KeibaAI-phone-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path /tmp/KeibaAI-phone-tests.xcresult --output-path /tmp/KeibaAI-phone-screenshots
          fi
      - name: Preserve iPhone UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-phone-ui-tests-${{ github.run_id }}
          path: |
            /tmp/KeibaAI-phone-tests.xcresult
            /tmp/KeibaAI-phone-screenshots
          if-no-files-found: ignore
          retention-days: 7
