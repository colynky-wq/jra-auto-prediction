name: KeibaAI Production History Update

on:
  pull_request:
    paths:
      - 'production/history_update_source.py'
      - 'production/update_production_history.py'
      - 'production/test_history_update_source.py'
      - '.github/workflows/keibaai-history-update.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JST date YYYYMMDD. Leave blank to use today.'
        required: false
        default: ''
      apply_changes:
        description: 'Replace production_history.parquet after all validation passes?'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
  schedule:
    # 21:15 JST every day. Non-JRA dates safely skip.
    - cron: '15 12 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: keibaai-production-history-update
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==23.0.1'
      - name: Verify calendar failure handling and immutable target day without network
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s production -p 'test_history_update_source.py' -v
  update-history:
    if: github.event_name != 'pull_request'
    name: Validate and update production history
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Preserve original run day across queue delays and retries
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          created_at="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq .created_at)"
          test -n "$created_at"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: pip install -r production/requirements.txt

      - name: Install history-update dependencies
        run: pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'

      - name: Validate / update 23-column production history
        env:
          KEIBAAI_HISTORY_DATE: ${{ inputs.target_date }}
          KEIBAAI_HISTORY_RUN_CREATED_AT: ${{ steps.context.outputs.created_at }}
          KEIBAAI_HISTORY_APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply_changes }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/update_production_history.py

      - name: Commit production history when changed
        id: publish_history
        shell: bash
        run: |
          set -euo pipefail
          history_changed=false
          if ! git diff --quiet -- production/production_history.parquet; then
            history_changed=true
          fi
          echo "history_changed=$history_changed" >> "$GITHUB_OUTPUT"

          if [ -z "$(git status --porcelain -- production/production_history.parquet reports/history_updates)" ]; then
            echo 'No production history changes to commit.'
            exit 0
          fi

          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add production/production_history.parquet reports/history_updates
          git commit -m "Update KeibaAI production history"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Refresh app research display after history changes
        if: steps.publish_history.outputs.history_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keibaai-app-research-publish.yml --ref main
