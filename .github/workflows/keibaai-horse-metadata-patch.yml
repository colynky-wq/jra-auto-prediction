name: KeibaAI Horse Metadata Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-horse-metadata-patch.yml'

permissions:
  contents: write

concurrency:
  group: keibaai-horse-metadata-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch prediction payload and iOS display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'production/live_monitor_topk.py',
              '''            "年齢": pred["年齢"].astype(int),
                          "馬キー": pred["馬キー"].astype(str),
                          "単勝オッズ": pred["単勝オッズ"].astype(float),''',
              '''            "年齢": pred["年齢"].astype(int),
                          "馬キー": pred["馬キー"].astype(str),
                          "騎手": pred["騎手"].astype(str),
                          "斤量": pred["斤量"].astype(float),
                          "人気": pred["人気"].astype(float),
                          "馬体重": pred["馬体重"].astype(float),
                          "増減": pred["増減"].astype(float),
                          "単勝オッズ": pred["単勝オッズ"].astype(float),'''
          )

          replace(
              'production/live_monitor_topk_publish.py',
              '''def _number(value, digits: int = 3) -> float:
              return round(float(value), digits)


          def _target_date_text() -> str:''',
              '''def _number(value, digits: int = 3) -> float:
              return round(float(value), digits)


          def _optional_text(value) -> str | None:
              if pd.isna(value):
                  return None
              text = str(value).strip()
              return text or None


          def _optional_number(value, digits: int = 1) -> float | None:
              if pd.isna(value):
                  return None
              return round(float(value), digits)


          def _optional_int(value) -> int | None:
              if pd.isna(value):
                  return None
              return int(value)


          def _target_date_text() -> str:'''
          )

          replace(
              'production/live_monitor_topk_publish.py',
              '''                "age": int(row["年齢"]),
                              "horseKey": str(row["馬キー"]),
                              "odds": _number(row["単勝オッズ"], 1),''',
              '''                "age": int(row["年齢"]),
                              "horseKey": str(row["馬キー"]),
                              "jockey": _optional_text(row.get("騎手")),
                              "carriedWeight": _optional_number(row.get("斤量"), 1),
                              "popularity": _optional_int(row.get("人気")),
                              "bodyWeight": _optional_int(row.get("馬体重")),
                              "bodyWeightChange": _optional_int(row.get("増減")),
                              "odds": _number(row["単勝オッズ"], 1),'''
          )

          replace(
              'ios/KeibaAI/KeibaAI/KeibaAIModels.swift',
              '''    var age: Int? = nil
              var horseKey: String? = nil
          }''',
              '''    var age: Int? = nil
              var horseKey: String? = nil

              // 発走前のJRA出馬表から取得。旧RaceDataとの互換性のためOptional。
              var jockey: String? = nil
              var carriedWeight: Double? = nil
              var popularity: Int? = nil
              var bodyWeight: Int? = nil
              var bodyWeightChange: Int? = nil
          }'''
          )

          replace(
              'ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift',
              '''    private var researchLabel: String {
              if horse.aiMarketRatio >= 1.20 {
                  return "高乖離候補"
              } else if horse.aiMarketRatio >= 1.10 {
                  return "注目"
              } else if horse.aiMarketRatio >= 1.05 {
                  return "やや高評価"
              } else if horse.aiMarketRatio >= 0.95 {
                  return "市場並み"
              } else {
                  return "AI低評価"
              }
          }

          var body: some View {''',
              '''    private var researchLabel: String {
              if horse.aiMarketRatio >= 1.20 {
                  return "高乖離候補"
              } else if horse.aiMarketRatio >= 1.10 {
                  return "注目"
              } else if horse.aiMarketRatio >= 1.05 {
                  return "やや高評価"
              } else if horse.aiMarketRatio >= 0.95 {
                  return "市場並み"
              } else {
                  return "AI低評価"
              }
          }

          private var bodyWeightText: String {
              guard let weight = horse.bodyWeight else { return "馬体重 未発表" }
              guard let change = horse.bodyWeightChange else { return "馬体重 \\(weight)kg" }
              let diff = change > 0 ? "+\\(change)" : "\\(change)"
              return "馬体重 \\(weight)kg（\\(diff)）"
          }

          private var carriedWeightText: String {
              guard let value = horse.carriedWeight else { return "斤量 --" }
              if value.rounded() == value { return "斤量 \\(Int(value))kg" }
              return String(format: "斤量 %.1fkg", value)
          }

          var body: some View {'''
          )

          replace(
              'ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift',
              '''                        VStack(alignment: .leading, spacing: 3) {
                              Text(horse.name)
                                  .font(.headline)
                                  .foregroundStyle(.primary)

                              HStack(spacing: 5) {
                                  Text(researchLabel)
                                      .font(.caption2.weight(.semibold))
                                      .foregroundStyle(labelTint)
                                  Text("馬データを見る")
                                      .font(.caption2)
                                      .foregroundStyle(.blue)
                              }
                          }''',
              '''                        VStack(alignment: .leading, spacing: 3) {
                              Text(horse.name)
                                  .font(.headline)
                                  .foregroundStyle(.primary)

                              Text(horse.jockey.map { "\\($0) 騎手" } ?? "騎手 --")
                                  .font(.caption)
                                  .foregroundStyle(.secondary)
                                  .lineLimit(1)

                              HStack(spacing: 8) {
                                  Text(bodyWeightText)
                                  Text(carriedWeightText)
                              }
                              .font(.caption2.monospacedDigit())
                              .foregroundStyle(.secondary)
                              .lineLimit(1)

                              HStack(spacing: 5) {
                                  Text(researchLabel)
                                      .font(.caption2.weight(.semibold))
                                      .foregroundStyle(labelTint)
                                  Text("馬データを見る")
                                      .font(.caption2)
                                      .foregroundStyle(.blue)
                              }
                          }'''
          )

          replace(
              'ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift',
              '''                    Text("単勝")
                                  .font(.caption2)
                                  .foregroundStyle(.secondary)''',
              '''                    Text(horse.popularity.map { "\\($0)人気・単勝" } ?? "単勝")
                                  .font(.caption2)
                                  .foregroundStyle(.secondary)'''
          )
          PY

      - name: Validate Python source and patch markers
        shell: bash
        run: |
          python -m py_compile production/live_monitor_topk.py production/live_monitor_topk_publish.py
          grep -q 'bodyWeightChange' ios/KeibaAI/KeibaAI/KeibaAIModels.swift
          grep -q '馬体重 未発表' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift
          grep -q 'popularity.map' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift

      - name: Commit source changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          rm .github/workflows/keibaai-horse-metadata-patch.yml
          git add production/live_monitor_topk.py production/live_monitor_topk_publish.py \
            ios/KeibaAI/KeibaAI/KeibaAIModels.swift ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift \
            .github/workflows/keibaai-horse-metadata-patch.yml
          git commit -m 'Show jockey weight popularity in KeibaAI'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
