name: KeibaAI Longshot Market Calibration Ablation

# Research only: check whether the AI adds ability beyond a simple constant
# correction of closing-market Top3 probabilities; no model changes or wagers.
on:
  pull_request:
    paths:
      - 'production/research_longshot_market_calibration_ablation.py'
      - 'production/test_research_longshot_market_calibration_ablation.py'
      - '.github/workflows/keibaai-longshot-market-calibration-ablation.yml'
  push:
    branches: [main]
    paths:
      - 'production/research_longshot_market_calibration_ablation.py'
      - 'production/test_research_longshot_market_calibration_ablation.py'
      - '.github/workflows/keibaai-longshot-market-calibration-ablation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keibaai-longshot-market-calibration-ablation
  cancel-in-progress: false

jobs:
  ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install pinned research dependencies
        run: pip install -r production/requirements.txt
      - name: Test exact 2024-only market calibration and isolated models
        run: |
          python -m py_compile production/research_longshot_market_calibration_ablation.py production/test_research_longshot_market_calibration_ablation.py
          python -m unittest discover -s production -p 'test_research_longshot_market_calibration_ablation.py' -v
      - name: Blind retrospective 2025/2026 comparison
        if: github.event_name != 'pull_request'
        env:
          OMP_NUM_THREADS: '2'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -u production/research_longshot_market_calibration_ablation.py
      - name: Assert no leakage or model promotion
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          x=json.loads(Path("research/LongshotMarketCalibrationAblation.json").read_text(encoding="utf-8"))
          raw=Path("research/model_candidates/longshot_top3_v1/longshot_top3_residual.txt").read_bytes()
          assert x["longshotModelSha256"]==hashlib.sha256(raw).hexdigest()
          assert x["calibrationSelectedIn"]=="2024-only"
          assert x["2025"]["races"]>3000 and x["2026"]["races"]>2000
          assert x["researchOnly"] is True
          assert x["candidatePromotionApproved"] is False
          assert x["formalPredictionAIChanged"] is False
          assert x["autoBetEnabled"] is False
          for k in ("2025","2026"):
            r=x[k]
            assert sum(r["rankingAmongLongshots"][f] for f in
                ("bothHit","marketOnlyHit","candidateOnlyHit","neitherHit"))==r["races"]
          print("LONGSHOT_CALIBRATION_ABLATION_VERIFIED",
                x["calibrationSelection"],
                x["2025"]["aiMinusSimpleMarketBrier"],
                x["2026"]["aiMinusSimpleMarketBrier"])
          PY
      - name: Save reproducible ablation artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: longshot-market-calibration-ablation
          path: |
            research/LongshotMarketCalibrationAblation.json
            research/LongshotMarketCalibrationAblation.md
          retention-days: 30
          if-no-files-found: error
      - name: Publish research-only comparison report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add -f research/LongshotMarketCalibrationAblation.json research/LongshotMarketCalibrationAblation.md
          if git diff --cached --quiet; then
            echo 'CALIBRATION_ABLATION_UNCHANGED'
            exit 0
          fi
          git commit -m 'Publish longshot calibration-only ablation on frozen 2025-26 records'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'CALIBRATION_ABLATION_PUBLISHED'
              exit 0
            fi
            sleep $((2*attempt))
          done
          echo '::error::Could not publish; diagnostic artifact preserved' >&2
          exit 1
