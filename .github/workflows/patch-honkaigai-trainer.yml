name: Patch 本会外 Trainer Parser

on:
  push:
    branches: [fix/jra-honkaigai-trainer-20261023]
    paths:
      - '.github/workflows/patch-honkaigai-trainer.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('production/jra_entry_source.py')
          s=p.read_text(encoding='utf-8')
          old='string=re.compile(r"\\(\\s*(美浦|栗東)\\s*\\)")'
          new='string=re.compile(r"\\(\\s*(美浦|栗東|本会外)\\s*\\)")'
          if s.count(old) != 1:
              raise SystemExit(f'expected one affiliation regex, got {s.count(old)}')
          s=s.replace(old,new)
          marker='        trainer_full = None\n'
          comment=('        # JRA labels trainers from outside the JRA system as "本会外".\n'
                   '        # Treat that label like 美浦/栗東 so the trainer anchor is retained.\n')
          if comment not in s:
              if s.count(marker) != 1:
                  raise SystemExit('trainer marker count mismatch')
              s=s.replace(marker, marker+comment)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile production/jra_entry_source.py
      - name: Verify current local trainers are parsed by name
        env:
          PYTHONPATH: production
        run: |
          python - <<'PY'
          from datetime import timedelta, timezone
          from jra_entry_source import fetch_entry_table
          JST=timezone(timedelta(hours=9))
          cases={
              '202608040810': {7:'小国博行', 9:'荒山勝徳'},
              '202605040811': {8:'飯田弘道'},
          }
          for rid, expected in cases.items():
              d, _, _ = fetch_entry_table(rid,'20261024',JST)
              got={int(r['馬番']): str(r['調教師_JRA']).replace(' ','') for _,r in d.iterrows()}
              for no,name in expected.items():
                  print('TRAINER_PARSE',rid,no,got.get(no))
                  assert got.get(no)==name, (rid,no,got.get(no),name)
          print('HONKAIGAI_TRAINER_PARSE_OK')
          PY
      - name: Commit parser fix to branch
        run: |
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add production/jra_entry_source.py
          git diff --cached --quiet && exit 0
          git commit -m 'Parse JRA 本会外 trainer names'
          git push origin HEAD:fix/jra-honkaigai-trainer-20261023