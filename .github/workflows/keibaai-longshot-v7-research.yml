name: KeibaAI Longshot V7 Ranking Research
on:
  pull_request:
    paths:
      - 'production/research_longshot_top3_v7.py'
      - 'production/test_research_longshot_top3_v7.py'
      - '.github/workflows/keibaai-longshot-v7-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r production/requirements.txt
      - run: python production/test_research_longshot_top3_v7.py -v
      - name: Compare within-race rank learning to frozen V2
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python production/research_longshot_top3_v7.py
      - uses: actions/upload-artifact@v4
        with:
          name: longshot-v7-research
          path: research/model_candidates/longshot_top3_v7/
