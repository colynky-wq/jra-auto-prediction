name: KeibaAI iOS Build and Identity
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/keibaai-ios-verify.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/keibaai-ios-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Verify Xcode and compile the actual model and identity code
        run: |
          xcodebuild -version
          swiftc -swift-version 5 ios/KeibaAI/KeibaAI/KeibaAIModels.swift ios/KeibaAI/KeibaAI/KeibaAIHorseIdentity.swift ios/tests/ProfileIdentityChecks.swift -o /tmp/keibaai-profile-checks
          /tmp/keibaai-profile-checks
          swiftc -swift-version 5 ios/KeibaAI/KeibaAI/KeibaAIHorseIdentity.swift ios/KeibaAI/KeibaAI/KeibaAIHorseProfiles.swift ios/tests/ProfileStoreChecks.swift -o /tmp/keibaai-store-checks
          /tmp/keibaai-store-checks
          swiftc -swift-version 5 ios/KeibaAI/KeibaAI/KeibaAIRecordingStatusModels.swift ios/tests/RecordingStatusChecks.swift -o /tmp/keibaai-recording-checks
          /tmp/keibaai-recording-checks
      - name: Verify the actual recording refresh store with isolated HTTP responses
        run: |
          python3 ios/tests/build_recording_store_checks.py --source ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift --checks ios/tests/RecordingStatusStoreChecks.swift --output /tmp/KeibaAIRecordingStoreChecks.swift
          swiftc -swift-version 5 -parse-as-library ios/KeibaAI/KeibaAI/KeibaAIRecordingStatusModels.swift /tmp/KeibaAIRecordingStoreChecks.swift -o /tmp/keibaai-recording-store-checks
          /tmp/keibaai-recording-store-checks
      - name: Build the complete iOS app without signing
        run: |
          xcodebuild -project ios/KeibaAI/KeibaAI.xcodeproj -scheme KeibaAI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/KeibaAI-build CODE_SIGNING_ALLOWED=NO build
      - name: Tap race details and the full guide on iPhone
        run: |
          python3 ios/tests/prepare_phone_ui_tests.py
          phone_test_udid=$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          devices=[d for runtime,rows in data['devices'].items() if 'iOS-27' in runtime for d in rows if d['name'].startswith('iPhone') and d['isAvailable']]
          assert devices, 'iOS 27 iPhone simulator is required'
          devices.sort(key=lambda d:(d['name']!='iPhone 18 Pro',d['name']))
          print(devices[0]['udid'])
          PY
          )
          xcrun simctl boot "$phone_test_udid" || true
          xcrun simctl bootstatus "$phone_test_udid" -b
          xcodebuild -project ios/KeibaAI/KeibaAI.xcodeproj -scheme KeibaAIPhoneUITests -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$phone_test_udid" -parallel-testing-enabled NO -derivedDataPath /tmp/KeibaAI-phone-build -resultBundlePath /tmp/KeibaAI-phone-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Preserve iPhone UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-phone-ui-tests-${{ github.run_id }}
          path: /tmp/KeibaAI-phone-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
