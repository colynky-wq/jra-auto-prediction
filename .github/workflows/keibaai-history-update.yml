name: KeibaAI Production History Update

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JST date YYYYMMDD. Leave blank to use today.'
        required: false
        default: ''
      apply_changes:
        description: 'Replace production_history.parquet after all validation passes?'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
  schedule:
    # 21:15 JST every day. Non-JRA dates safely skip.
    - cron: '15 12 * * *'

permissions:
  contents: write

concurrency:
  group: keibaai-production-history-update
  cancel-in-progress: false

jobs:
  update-history:
    name: Validate and update production history
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: pip install -r production/requirements.txt

      - name: Install history-update dependencies
        run: pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'

      - name: Validate / update 23-column production history
        env:
          KEIBAAI_HISTORY_DATE: ${{ inputs.target_date }}
          KEIBAAI_HISTORY_APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply_changes }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/update_production_history.py

      - name: Commit production history when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- production/production_history.parquet reports/history_updates)" ]; then
            echo 'No production history changes to commit.'
            exit 0
          fi

          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add production/production_history.parquet reports/history_updates
          git commit -m "Update KeibaAI production history"
          git push
