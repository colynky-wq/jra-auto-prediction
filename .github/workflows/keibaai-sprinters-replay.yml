name: KeibaAI Sprinters Stakes Replay

on:
  push:
    branches: [keibaai-sprinters-replay]
    paths:
      - '.github/workflows/keibaai-sprinters-replay.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'
      - name: Replay 2026 Sprinters Stakes with pre-race history only
        env:
          KEIBAAI_EARLY_DATE: '20260927'
          KEIBAAI_EARLY_STAGE: 'historical_replay'
        run: |
          cd production
          python - <<'PY'
          import re
          import unicodedata
          import numpy as np
          import pandas as pd
          import requests
          import lightgbm as lgb
          from bs4 import BeautifulSoup
          import early_prediction_runtime as ep

          date8='20260927'
          target_rid='202606040911'
          ep.base.TARGET_DATE8=date8
          ep.live.base.TARGET_DATE8=date8

          target_date=pd.Timestamp('2026-09-27')
          hist=ep.base.load_history(target_date)
          print('HISTORY_MAX_DATE', hist['日付'].max())

          def norm(x):
              s=unicodedata.normalize('NFKC', str(x or ''))
              s=re.sub(r'[\s・\.．]', '', s)
              s=re.sub(r'^(美浦|栗東)', '', s)
              return s

          hist_jockeys=sorted(set(hist['騎手'].dropna().astype(str)))
          hist_trainers=sorted(set(hist['調教師'].dropna().astype(str)))

          def resolve_abbrev(raw, candidates):
              n=norm(raw)
              if not n:
                  return str(raw)
              scored=[]
              for c in candidates:
                  cn=norm(c)
                  if n==cn:
                      scored.append((10000+len(cn), c))
                  elif cn.startswith(n) or n.startswith(cn):
                      scored.append((5000+min(len(n),len(cn)), c))
                  elif n in cn or cn in n:
                      scored.append((1000+min(len(n),len(cn)), c))
              if scored:
                  scored.sort(reverse=True)
                  return scored[0][1]
              return str(raw)

          def historical_entry_table(race_id, date8_arg, jst):
              url=f'https://race.netkeiba.com/race/shutuba.html?race_id={race_id}'
              r=requests.get(url, headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja'}, timeout=30)
              r.raise_for_status()
              soup=BeautifulSoup(r.content.decode('utf-8', errors='replace'), 'html.parser')
              horse_rows=soup.select('tr.HorseList')
              print('HIST_HORSE_ROWS_RAW', len(horse_rows))

              rows=[]
              for tr in horse_rows:
                  items=[x.strip() for x in tr.stripped_strings if str(x).strip()]
                  if len(items) < 10:
                      continue
                  sex_idx=None
                  for i,x in enumerate(items):
                      if re.fullmatch(r'(牡|牝|せん|セン|セ)\s*\d+', x):
                          sex_idx=i
                          break
                  if sex_idx is None or sex_idx < 2 or sex_idx + 6 >= len(items):
                      continue
                  no=None
                  for x in items[:min(4,len(items))]:
                      if re.fullmatch(r'\d{1,2}', x):
                          v=int(x)
                          if 1 <= v <= 18:
                              no=v
                  if no is None:
                      continue
                  name=items[sex_idx-1]
                  age=int(re.search(r'\d+', items[sex_idx]).group())
                  try:
                      carried=float(re.search(r'\d+(?:\.\d+)?', items[sex_idx+1]).group())
                  except Exception:
                      continue
                  jockey_raw=items[sex_idx+2]
                  aff=items[sex_idx+3]
                  trainer_raw=items[sex_idx+4]
                  if aff not in {'美浦','栗東'}:
                      continue
                  jockey=resolve_abbrev(jockey_raw, hist_jockeys)
                  trainer=resolve_abbrev(trainer_raw, hist_trainers)
                  bw_token=items[sex_idx+5]
                  diff_token=items[sex_idx+6]
                  mbw=re.search(r'\d{3}', bw_token)
                  bw=float(mbw.group()) if mbw else np.nan
                  mdiff=re.search(r'([+-]?\d+)', diff_token)
                  diff=float(mdiff.group(1)) if mdiff and '前計不' not in diff_token else np.nan
                  rows.append({'馬番':no,'馬名':name,'年齢':age,'斤量':carried,
                               '騎手_JRA':jockey,'調教師_JRA':trainer,'馬体重':bw,'増減':diff})

              d=pd.DataFrame(rows)
              if d.empty:
                  raise RuntimeError('historical positional parse returned 0 rows')
              d=d.drop_duplicates('馬番', keep='first').sort_values('馬番').reset_index(drop=True)
              print('HIST_ENTRY_ROWS', len(d))
              if len(d) != 16:
                  raise RuntimeError(f'historical entry rows expected 16 got {len(d)}')
              return d, ep.base.now_jst(), url

          ep.base.fetch_jra_entry_table=historical_entry_table
          ep.live.base.fetch_jra_entry_table=historical_entry_table

          original_fetch_meta = ep.base.fetch_meta
          def corrected_fetch_meta(race):
              out = original_fetch_meta(race)
              if str(out.get('race_id')) == target_rid:
                  out['class'] = 'OP'
              return out
          ep.base.fetch_meta = corrected_fetch_meta
          ep.live.base.fetch_meta = corrected_fetch_meta

          races=ep.base.fetch_schedule(date8)
          target=[r for r in races if str(r.get('race_id'))==target_rid]
          if len(target) != 1:
              raise RuntimeError(f'Sprinters target count={len(target)}')

          out=ep._safe_predict(target[0], hist, target_date)
          ranked=out.sort_values('AI勝率(%)', ascending=False).reset_index(drop=True)
          print('SPRINTERS_REPLAY_BEGIN')
          print(ranked.to_json(orient='records', force_ascii=False))
          print('SPRINTERS_REPLAY_END')

          # Rebuild exactly the same 37-feature matrix so the fixed LightGBM
          # contribution for each feature can be inspected without using result data.
          race=corrected_fetch_meta(target[0])
          odds,_=ep.base.fetch_win_odds(target_rid)
          entries,_,_=historical_entry_table(target_rid, date8, ep.base.JST)
          entries['騎手']=entries['騎手_JRA']
          entries['調教師']=entries['調教師_JRA']
          entries['馬キー']=ep.live.assign_horse_keys(entries, hist, target_date)
          current=entries.merge(odds,on='馬番',how='inner',validate='one_to_one').sort_values('馬番').reset_index(drop=True)
          current['人気']=current['単勝オッズ'].rank(ascending=True,method='min')

          cur=pd.DataFrame(index=np.arange(len(current)))
          cur['レースID']=target_rid
          cur['日付']=target_date
          for col in ['馬番','馬名','馬キー','年齢','斤量','騎手','調教師','人気','単勝オッズ','馬体重','増減']:
              cur[col]=current[col].to_numpy()
          cur['着順']=np.nan
          cur['出典']='Sprinters historical diagnostic'
          cur['芝ダ']=race['surface']
          cur['距離']=int(race['distance'])
          cur['クラス']=race['class']
          cur['障害']=False
          cur['タイム秒']=np.nan
          cur['上がり3F']=np.nan
          cur['初角']=np.nan
          cur['頭数']=len(cur)

          work=pd.concat([hist,cur],ignore_index=True)
          work['日付']=pd.to_datetime(work['日付'],errors='coerce')
          work=work.sort_values(['日付','レースID','馬番']).reset_index(drop=True)
          work=ep.base.add_rating(work)
          work=ep.base.add_features(work)
          pred=(work.loc[(work['日付'].dt.normalize()==target_date.normalize()) & (work['レースID'].astype(str)==target_rid)]
                    .copy().sort_values('馬番').reset_index(drop=True))
          X=pred[ep.base.ALLF].astype(np.float32)
          model=lgb.Booster(model_file=str(ep.base.MODEL_PATH))
          raw=np.asarray(model.predict(X,raw_score=True,validate_features=True),dtype=float)
          pc=np.asarray(model.predict(X,pred_contrib=True,validate_features=True),dtype=float)
          features=list(ep.base.ALLF)

          print('FEATURE_DIAGNOSTICS_BEGIN')
          for horse_no in [16,6,5,9,13]:
              i=int(pred.index[pred['馬番'].astype(int)==horse_no][0])
              row=pred.iloc[i]
              feature_contrib=pc[i,:len(features)]
              bias=float(pc[i,len(features)])
              recs=[]
              for f,v,c in zip(features,X.iloc[i].to_numpy(dtype=float),feature_contrib):
                  recs.append({'feature':f,'value':float(v),'contribution':float(c),'abs':abs(float(c))})
              recs_sorted=sorted(recs,key=lambda z:z['abs'],reverse=True)
              neg=sorted(recs,key=lambda z:z['contribution'])[:12]
              pos=sorted(recs,key=lambda z:z['contribution'],reverse=True)[:12]
              print('HORSE_SUMMARY', {
                  'horse_no':horse_no,
                  'horse_name':str(row['馬名']),
                  'odds':float(row['単勝オッズ']),
                  'market_probability':float(row['市場確率']),
                  'market_logit':float(row['市場ロジット']),
                  'tree_raw_correction':float(raw[i]),
                  'bias':bias,
                  'contrib_sum':float(feature_contrib.sum()+bias),
                  'final_logit':float(row['市場ロジット']+raw[i]),
                  'style_first_corner':float(row['脚質初角']),
                  'gate_position':float(row['枠位置']),
                  'inside_front':float(row['内枠先行']),
                  'rating_diff':float(row['点数差']),
                  'same_distance_mean':float(row['同距離帯平均']),
                  'prev_finish_rate':float(row['前走着順率f'])
              })
              print('TOP_ABS_CONTRIB', horse_no, recs_sorted[:15])
              print('TOP_NEG_CONTRIB', horse_no, neg)
              print('TOP_POS_CONTRIB', horse_no, pos)
              if horse_no==16:
                  print('PYURO_ALL_FEATURES', recs)
          print('FEATURE_DIAGNOSTICS_END')
          PY