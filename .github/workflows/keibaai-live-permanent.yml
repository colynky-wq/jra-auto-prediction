# 2026-11-01: start the afternoon session early enough to absorb GitHub schedule delay.
name: KeibaAI Live Permanent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-live-permanent.yml'
      - '.github/scripts/keibaai-race-day-check.sh'
      - 'production/test_race_day_check.sh'
      - 'production/live_monitor_topk_publish.py'
      - 'production/market_shrink_shadow.py'
      - 'production/test_market_shrink_shadow.py'
      - 'production/live_bundle_publisher.py'
      - 'production/race_simulator_v02.py'
      - 'production/race_simulator_v02_adapter.py'
      - 'production/race_simulator_calibration.py'
      - 'production/race_simulator_learning.py'
      - 'production/race_simulator_guards.py'
      - 'production/race_simulator_operations.py'
      - 'production/test_race_simulator_operations.py'
      - 'production/test_race_simulator_learning.py'
      - 'production/ticket_shadow_forward.py'
      - 'production/ticket_shadow_bridge.py'
      - 'production/ticket_probability_runtime.py'
      - 'production/all_bet_runtime.py'
      - 'production/triple_research_runtime.py'
      - 'production/formal_wide_odds_runtime.py'
      - 'production/resilient_live_entrypoint.py'
      - 'production/live_capture_policy.py'
      - 'production/live_recording_resume.py'
      - 'production/test_live_recording_resume.py'
      - 'production/test_live_capture_recovery.py'
      - 'production/live_session_slots.py'
      - 'production/test_live_session_slots.py'
  schedule:
    # Earlier backstop: GitHub scheduled runs can arrive hours late. The first
    # race has a fixed T-12..T-8 window; do not postdate missed captures.
    - cron: '15 20 * * 5,6,0'  # 05:15 JST Sat/Sun/Mon (UTC previous day)
    # Backup starts are serialized with the queue below and have strict
    # JST phase cutoffs. A delayed run never backfills missed T-10 windows.
    - cron: '15 21 * * 5,6,0'  # 06:15 JST Sat/Sun/Mon
    - cron: '15 23 * * 5,6,0'  # 08:15 JST Sat/Sun/Mon
    - cron: '45 22 * * *'  # 07:45 JST
    - cron: '0 3 * * *'    # 12:00 JST; queue early so cron delay cannot miss afternoon T-10 windows
    # GitHub cron is not punctual (on 2026-11-21 runs arrived hours late).
    # Staggered heartbeat launches mean the newest pending runner can take over
    # from a time-expired session without reconstructing missed T-10 records.
    - cron: '7,22,37,52 22-23 * * 5,6,0'  # 07:07-08:52 JST Sat/Sun/Mon
    - cron: '7,22,37,52 0-7 * * 0,1,6'    # 09:07-16:52 JST Sat/Sun/Mon
  workflow_dispatch:
    inputs:
      max_minutes:
        description: Optional live-monitor runtime for manual testing
        required: false
        default: '120'
permissions:
  contents: write
concurrency:
  group: keibaai-live-${{ github.event_name == 'push' && github.sha || 'production' }}
  # Keep the running production writer; replace a stale pending heartbeat with
  # the newest one. Never accumulate dozens of delayed, obsolete cron launches.
  # Any replacement can cover the remaining day via the heartbeat JST cutoff.
  queue: single
  cancel-in-progress: false
jobs:
  monitor:
    name: Automatic Win Top2 Top3 Signal Wide monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout lightweight startup guard
        uses: actions/checkout@v5
        with:
          path: startup-guard
          sparse-checkout: |
            /.github/scripts/keibaai-race-day-check.sh
            /production/live_session_slots.py
          sparse-checkout-cone-mode: false

      - name: Decide CI or live race day
        id: day
        shell: bash
        run: |
          set -euo pipefail
          date8=$(TZ=Asia/Tokyo date '+%Y%m%d')
          if [ "${{ github.event_name }}" = 'push' ]; then
            echo "target_date=$date8" >> "$GITHUB_OUTPUT"
            echo "has_races=false" >> "$GITHUB_OUTPUT"
            echo 'Push event: run CI only; production live monitor is disabled.'
            exit 0
          fi
          bash startup-guard/.github/scripts/keibaai-race-day-check.sh "$date8"

      - name: Confirm no races on schedule
        if: github.event_name == 'schedule' && steps.day.outputs.has_races == 'false'
        run: |
          echo 'Verified non-race day: live monitor not required.'

      - name: Select bounded JST session slot before expensive setup
        id: runtime
        if: github.event_name != 'push' && steps.day.outputs.has_races == 'true'
        env:
          KEIBAAI_EVENT_NAME: ${{ github.event_name }}
          KEIBAAI_EVENT_SCHEDULE: ${{ github.event.schedule }}
          KEIBAAI_DATE8: ${{ steps.day.outputs.target_date }}
          KEIBAAI_MAX_MINUTES_INPUT: ${{ github.event.inputs.max_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          python3 startup-guard/production/live_session_slots.py --github-output "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: github.event_name == 'push' || (steps.day.outputs.has_races == 'true' && steps.runtime.outputs.active == 'true')
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        if: github.event_name == 'push' || (steps.day.outputs.has_races == 'true' && steps.runtime.outputs.active == 'true')
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        if: github.event_name == 'push' || (steps.day.outputs.has_races == 'true' && steps.runtime.outputs.active == 'true')
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Smoke-test bundled runtime
        if: github.event_name == 'push' || (steps.day.outputs.has_races == 'true' && steps.runtime.outputs.active == 'true')
        run: |
          bash -n .github/scripts/keibaai-race-day-check.sh
          bash production/test_race_day_check.sh
          python -m py_compile production/live_monitor_topk_publish.py
          python -m py_compile production/market_shrink_shadow.py production/test_market_shrink_shadow.py
          python production/test_market_shrink_shadow.py -v
          python -m py_compile production/live_bundle_publisher.py
          python -m py_compile production/race_simulator_learning.py
          python -m unittest discover -s production -p test_race_simulator_learning.py
          python -m unittest discover -s production -p test_race_simulator_operations.py
          python -m py_compile production/ticket_shadow_forward.py
          python -m py_compile production/ticket_shadow_bridge.py
          python -m py_compile production/ticket_probability_runtime.py
          python -m py_compile production/resilient_live_entrypoint.py
          python -m py_compile production/live_capture_policy.py
          python -m py_compile production/live_session_slots.py
          python -m py_compile production/live_recording_resume.py
          python -m py_compile production/all_bet_runtime.py
          python -m py_compile production/triple_research_runtime.py
          python -m py_compile production/wide_odds_runtime.py
          python -m py_compile production/formal_wide_odds_runtime.py
          python -m py_compile production/build_signal_data_v2.py
          python -m py_compile production/repair_wide_odds.py
          python production/smoke_topk_runtime.py
          python production/test_live_recording_resume.py
          python production/test_live_capture_recovery.py
          python production/test_live_session_slots.py -v

      - name: Configure git publisher
        if: github.event_name != 'push' && steps.day.outputs.has_races == 'true' && steps.runtime.outputs.active == 'true'
        run: |
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'

      - name: Recheck JST phase cutoff immediately before live worker starts
        id: runtime_final
        if: github.event_name != 'push' && steps.day.outputs.has_races == 'true' && steps.runtime.outputs.active == 'true'
        env:
          KEIBAAI_EVENT_NAME: ${{ github.event_name }}
          KEIBAAI_EVENT_SCHEDULE: ${{ github.event.schedule }}
          KEIBAAI_DATE8: ${{ steps.day.outputs.target_date }}
          KEIBAAI_MAX_MINUTES_INPUT: ${{ github.event.inputs.max_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          # Setup, dependency installation, and smoke tests may consume minutes.
          # Recalculate remaining time to avoid running an expired backup.
          python production/live_session_slots.py --github-output "$GITHUB_OUTPUT"

      - name: Monitor races and publish one consistent bundle
        id: session
        if: github.event_name != 'push' && steps.day.outputs.has_races == 'true' && steps.runtime_final.outputs.active == 'true'
        env:
          KEIBAAI_LIVE_DATE: ${{ steps.day.outputs.target_date }}
          KEIBAAI_LIVE_MODE: 'live'
          KEIBAAI_LIVE_RACE_ID: ''
          KEIBAAI_LIVE_MAX_MINUTES: ${{ steps.runtime_final.outputs.minutes }}
          KEIBAAI_LIVE_POLL_SECONDS: '10'
          KEIBAAI_LIVE_GRACE_MINUTES: '5'
          KEIBAAI_PUBLISH_RACEDATA: 'true'
          KEIBAAI_CAPTURE_WIDE_ODDS: 'true'
          KEIBAAI_CAPTURE_PRERACE: 'true'
          KEIBAAI_REFRESH_SIGNALS: 'true'
          KEIBAAI_OUTBOX: ${{ runner.temp }}/keibaai-live-outbox
        shell: bash
        run: |
          set -euo pipefail
          date8='${{ steps.day.outputs.target_date }}'
          python production/live_bundle_publisher.py --date "$date8" --outbox "$KEIBAAI_OUTBOX" --poll-seconds 10 -- python -u production/resilient_live_entrypoint.py

      - name: Preserve live outbox for recovery
        if: always() && github.event_name != 'push' && steps.day.outputs.has_races == 'true' && steps.runtime_final.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-live-outbox-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/keibaai-live-outbox/state.json
            ${{ runner.temp }}/keibaai-live-outbox/blobs
          if-no-files-found: ignore
          retention-days: 14
