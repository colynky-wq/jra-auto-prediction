name: Test Early Prediction Completeness Gate

on:
  push:
    branches: [fix/early-prediction-completeness-gate-20261023]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'
      - name: Compile validator
        run: python -m py_compile production/validate_early_prediction.py
      - name: Accept complete 35-race snapshot
        env:
          KEIBAAI_EARLY_DATE: '20261024'
          KEIBAAI_EARLY_STAGE: previous_evening
        run: python production/validate_early_prediction.py
      - name: Reject deliberately incomplete snapshot
        env:
          KEIBAAI_EARLY_DATE: '20261024'
          KEIBAAI_EARLY_STAGE: previous_evening
        run: |
          cp EarlyPredictionData.json EarlyPredictionData.complete.json
          python - <<'PY'
          import json
          p='EarlyPredictionData.json'
          d=json.load(open(p,encoding='utf-8'))
          races=d['snapshots']['previous_evening']['races']
          removed=races.pop()
          print('DELIBERATELY_REMOVED', removed['raceID'])
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          if python production/validate_early_prediction.py; then
            echo 'ERROR: incomplete snapshot was accepted'
            exit 1
          fi
          mv EarlyPredictionData.complete.json EarlyPredictionData.json
          echo 'INCOMPLETE_SNAPSHOT_CORRECTLY_REJECTED'
