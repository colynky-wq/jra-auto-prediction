name: KeibaAI Odds Integrity Research Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'production/odds_integrity_audit.py'
      - 'production/final_odds_drift_audit.py'
      - 'production/market_logit_feature_audit.py'
      - 'production/team_nave_tan_history_probe.py'
      - 'tests/test_team_nave_tan_history_probe.py'
      - 'research/independent_odds_provider_selection.json'
      - 'docs/independent-odds-provider-decision-20261118.md'
      - 'tests/test_market_logit_feature_audit.py'
      - 'ops/mac_independent_odds_launchd.py'
      - 'tests/test_mac_independent_odds_launchd.py'
      - 'tests/test_final_odds_drift_audit.py'
      - 'tests/test_odds_integrity_audit.py'
      - '.github/workflows/keibaai-odds-integrity-research.yml'
      - 'production/independent_odds_*.py'
      - 'tests/test_independent_odds_*.py'
      - 'docs/independent-odds-*.md'
      - 'AlignedPortfolioReview.json'

permissions:
  contents: read

jobs:
  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable inputs
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests (no network required)
        run: python -m unittest discover -s tests -p 'test_odds_integrity_audit.py' -v

      - name: Independent-source comparison regression tests (no network)
        run: python -m unittest discover -s tests -p 'test_independent_odds_audit.py' -v

      - name: Licensed export folder bridge tests (offline only)
        run: python -m unittest discover -s tests -p 'test_independent_odds_dropwatch.py' -v

      - name: Licensed CSV adapter regression tests (no network)
        run: python -m unittest discover -s tests -p 'test_independent_odds_csv_adapter.py' -v

      - name: Mac authorized CSV bridge integration tests (no network)
        run: python -m unittest discover -s tests -p 'test_independent_odds_bridge.py' -v

      - name: Research CSV-to-receipt bridge empty-folder dry run
        run: python production/independent_odds_bridge.py --root . > independent-bridge-dry-run.json

      - name: Mac LaunchAgent opt-in generator regression tests
        run: python -m unittest discover -s tests -p 'test_mac_independent_odds_launchd.py' -v

      - name: Check Mac auto-setup preview does not install anything
        run: python ops/mac_independent_odds_launchd.py --repo-root . > mac-odds-agent-preview.txt

      - name: Offline independent-source comparison (missing data remain pending)
        run: python production/independent_odds_audit.py --root . > independent-odds-audit.json

      - name: Dry-run empty authorized export folder
        run: python production/independent_odds_dropwatch.py --root . --source-dir /tmp/keibaai-licensed-odds-drop --accepted-dir /tmp/keibaai-accepted-odds > independent-dropwatch-audit.json

      - name: Independent source comparison summary
        run: |
          python - <<'PY'
          import json
          data=json.load(open('independent-odds-audit.json', encoding='utf-8'))
          print('independentObservationFiles:', data['observationFilesPresent'])
          print('independentSourceQualityGate:', data['qualityGate'])
          print('unobservedRaces:', data['unobservedRaces'])
          PY

      - name: Test post-hoc frozen versus final odds drift (no lookahead)
        run: python -m unittest discover -s tests -p 'test_final_odds_drift_audit.py' -v

      - name: Measure historical win odds drift (never used in predictions)
        run: python production/final_odds_drift_audit.py --root . > final-odds-drift.json

      - name: Display final odds movement diagnostic
        run: |
          python - <<'PY'
          import json
          data=json.load(open('final-odds-drift.json', encoding='utf-8'))
          print('winOddsMatchedRaces:', data['matchedRacesAudited'])
          print('winOddsMatchedHorses:', data['totalHorsesCompared'])
          print('winFavoriteChanged:', data['favoriteChangedRaces'])
          print('medianAbsWinOddsMovePct:', data['medianAbsPctPriceMovement'])
          print('winOddsMoved20Pct:', data['horsesMovedAtLeast20Pct'])
          print('finalOddsUsedAsPreRace:', data['finalOddsUsedAsPreRace'])
          PY

      - name: Team-Nave documented TAN history offline parser tests
        run: python -m unittest discover -s tests -p 'test_team_nave_tan_history_probe.py' -v

      - name: Verify selected provider remains disabled pending user contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/independent_odds_provider_selection.json').read_text(encoding='utf-8'))
          assert x['selectionStatus']=='vendor_selected_pending_contract'
          assert x['operationalStatus']=='not_connected'
          assert x['subscriptionActive'] is False
          assert x['credentialAvailable'] is False
          assert x['independentEvidenceFilesCollected']==0
          assert x['formalBettingEnabled'] is False
          assert x['sourceAuthenticityVerified'] is False
          assert x['technical']['recommendedOption']=='ALL'
          assert x['technical']['historicalWideResponseSampleVerified'] is False
          print('independentOddsVendor:',x['providerDisplayName'])
          print('providerConnected:',x['subscriptionActive'])
          PY

      - name: Inspect LightGBM's actual market-logit usage
        run: |
          python -m unittest discover -s tests -p 'test_market_logit_feature_audit.py' -v
          python production/market_logit_feature_audit.py --model production/lightgbm_fixed_2025.txt > market-logit-feature-audit.json

      - name: Verify audited model matches frozen live shadow hashes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('market-logit-feature-audit.json').read_text())
          files=[
              'reports/20261107/ticket_shadow_v1/prediction/202605050101.json',
              'reports/20261108/ticket_shadow_v1/prediction/202605050204.json',
              'reports/20261115/ticket_shadow_v1/prediction/202603030407.json',
          ]
          for file in files:
              observed=json.loads(Path(file).read_text())
              expected=observed['models']['formalAWin']['sha256']
              if expected!=report['modelSha256']:
                  raise SystemExit('market model sha mismatch: '+file)
          print('marketModelLiveShadowHashMatched:',len(files))
          print('marketModelSha256:',report['modelSha256'])
          PY

      - name: Summarize market feature split statistics
        run: |
          python - <<'PY'
          import json
          x=json.load(open('market-logit-feature-audit.json', encoding='utf-8'))
          print('marketLogitPresent:',x['marketLogitPresent'])
          print('marketLogitSplitCount:',x['marketLogitSplitCount'])
          print('marketLogitSplitSharePct:',x['marketLogitSplitSharePct'])
          print('marketLogitGainSharePct:',x['marketLogitGainSharePct'])
          PY

      - name: Read-only odds provenance and reference-wide audit
        run: python production/odds_integrity_audit.py --root . --strict-structure > odds-integrity-audit.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          data=json.load(open('odds-integrity-audit.json', encoding='utf-8'))
          print('racesAudited:', data['racesAudited'])
          print('sourceAgeMinutes:', data['sourceAgeMinutes'])
          print('alertCounts:', data['alertCounts'])
          print('researchOddsReliability:', data['researchOddsReliability'])
          print('earlyVersusFormal:', data['earlyVersusFormal'])
          print('favoritePairPriceOutliers:', data['favoritePairPriceOutliers'])
          print('wideReferenceResearch:', data['wideReferenceResearch']['bins'])
          PY

      - name: Upload read-only research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-odds-integrity-research
          path: |
            odds-integrity-audit.json
            independent-odds-audit.json
            independent-dropwatch-audit.json
            independent-bridge-dry-run.json
            mac-odds-agent-preview.txt
            final-odds-drift.json
            market-logit-feature-audit.json
          if-no-files-found: ignore
