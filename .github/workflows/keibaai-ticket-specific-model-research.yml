name: KeibaAI Ticket Specific Model Research

on:
  push:
    branches: [keibaai-ticket-specific-model-research]
    paths:
      - 'production/ticket_probability_runtime.py'
      - 'production/test_ticket_probability_runtime.py'
      - '.github/workflows/keibaai-ticket-specific-model-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install pytest
      - name: Test ticket probability runtime
        run: |
          cd production
          pytest -q test_ticket_probability_runtime.py
