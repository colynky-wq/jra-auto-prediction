name: KeibaAI Longshot Factor Robustness Research

# Research-only diagnostic on existing historical data. Never touches
# production models, frozen T-10 predictions, or ticket logic.
on:
  pull_request:
    paths:
      - 'production/research_longshot_factor_robustness.py'
      - 'production/test_research_longshot_factor_robustness.py'
      - '.github/workflows/keibaai-longshot-factor-robustness.yml'
  push:
    branches: [main]
    paths:
      - 'production/research_longshot_factor_robustness.py'
      - 'production/test_research_longshot_factor_robustness.py'
      - '.github/workflows/keibaai-longshot-factor-robustness.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keibaai-longshot-factor-robustness
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install existing pinned numeric research dependencies
        run: pip install -r production/requirements.txt
      - name: Regression tests for fixed cohorts and outcome-independent inference
        run: |
          python -m py_compile production/research_longshot_factor_robustness.py production/test_research_longshot_factor_robustness.py
          python -m unittest discover -s production -p 'test_research_longshot_factor_robustness.py' -v
      - name: Evaluate fixed 2025/2026 cohorts and explain successes and failures
        if: github.event_name != 'pull_request'
        env:
          OMP_NUM_THREADS: '2'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -u production/research_longshot_factor_robustness.py
      - name: Verify report source/model provenance and research-only gates
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path('research/model_candidates/longshot_top3_v1')
          model=(base/'longshot_top3_residual.txt').read_bytes()
          r=json.loads(Path('research/LongshotFactorRobustnessReview.json').read_text(encoding='utf-8'))
          assert r['status']=='exploratory_retrospective_model_diagnostics'
          assert r['modelSha256']==hashlib.sha256(model).hexdigest()
          assert r['selection']['2024ValidationOnly'] is True
          assert r['selection']['2026ModelHyperparametersFrozen'] is True
          assert r['selection']['subgroupsCannotChangeLiveEligibility'] is True
          assert r['2025']['races']>3000 and r['2026']['races']>2000
          assert r['2025']['underdogHorseRows']>25000
          assert r['2026']['underdogHorseRows']>20000
          assert r['candidatePromotionApproved'] is False
          assert r['autoBetEnabled'] is False
          assert r['formalPredictionAIChanged'] is False
          assert '単勝オッズ帯' in r['2026']['segments']
          assert len(r['illustrative2026SurprisesAndFalsePositives'])>=2
          print('LONGSHOT_FACTOR_ROBUSTNESS_VERIFIED',
                r['2025']['segments']['ALL']['candidateMinusMarketPooledBrier'],
                r['2026']['segments']['ALL']['candidateMinusMarketPooledBrier'],
                len(r['crossYearDescriptiveReplications']))
          PY
      - name: Preserve independent diagnostic artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: longshot-factor-robustness-research
          path: |
            research/LongshotFactorRobustnessReview.json
            research/LongshotFactorRobustnessReview.md
          retention-days: 30
          if-no-files-found: error
      - name: Publish diagnostic reports only, never candidate models
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git add -f research/LongshotFactorRobustnessReview.json research/LongshotFactorRobustnessReview.md
          if git diff --cached --quiet; then
            echo 'NO_LONGSHOT_FACTOR_RESEARCH_CHANGES'
            exit 0
          fi
          git commit -m 'Publish longshot Top3 robustness research by pre-defined factors'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'LONGSHOT_FACTOR_RESEARCH_PUBLISHED'
              exit 0
            fi
            sleep $((2*attempt))
          done
          echo '::error::Research results not published; artifact remains available' >&2
          exit 1
