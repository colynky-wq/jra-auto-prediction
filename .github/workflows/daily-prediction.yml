name: Daily Horse Racing Prediction

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn gspread google-auth google-auth-oauthlib google-auth-httplib2 beautifulsoup4 requests lxml
      - name: Download pkl from Releases
        run: wget https://github.com/colynky-wq/jra-auto-prediction/releases/download/v1.0/history_data.pkl
      - name: Run prediction
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: python main.py
