name: KeibaAI Ticket Specific Model Research

on:
  push:
    branches: [keibaai-ticket-specific-model-research]
    paths:
      - 'production/ticket_probability_runtime.py'
      - 'production/test_ticket_probability_runtime.py'
      - 'production/research_ticket_oos_compare.py'
      - 'production/ticket_shadow_forward.py'
      - 'production/test_ticket_shadow_forward.py'
      - 'production/live_monitor_topk_publish.py'
      - 'production/all_bet_runtime.py'
      - 'production/triple_research_runtime.py'
      - 'production/live_recording_resume.py'
      - '.github/workflows/keibaai-ticket-specific-model-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install pytest 'requests==2.32.5'
      - name: Test ticket probability and prospective shadow runtimes
        run: |
          cd production
          pytest -q test_ticket_probability_runtime.py test_ticket_shadow_forward.py
      - name: Compile live integration
        run: |
          python -m py_compile production/ticket_shadow_forward.py
          python -m py_compile production/live_monitor_topk_publish.py
          python -m py_compile production/all_bet_runtime.py
          python -m py_compile production/triple_research_runtime.py
          python -m py_compile production/live_recording_resume.py
      - name: OOS compare formal A vs ticket-specific model
        run: |
          python production/research_ticket_oos_compare.py
      - name: Upload OOS result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-oos-compare
          path: reports/model_research/ticket_oos_compare_2026.json
          if-no-files-found: warn
