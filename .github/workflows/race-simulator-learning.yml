name: RaceSimulator forward learning

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is best-effort; late result publications need catch-up slots.
    - cron: '17 8,11,12,13 * * *' # 17:17, 20:17, 21:17, 22:17 JST
  workflow_run:
    # A successful scheduled result/performance job also wakes the learner,
    # even when this workflow's own cron was delayed or skipped.
    workflows: ['KeibaAI Bet Performance Summary', 'KeibaAI Live Result Sync']
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'production/race_simulator*.py'
      - 'production/test_race_simulator*.py'
      - 'production/build_race_simulation_data_v02.py'
      - 'production/live_bundle_publisher.py'
      - 'production/test_live_bundle_publisher.py'
      - '.github/workflows/race-simulator-learning.yml'
  push:
    branches: [main]
    paths:
      - 'production/race_simulator*.py'
      - 'production/test_race_simulator*.py'
      - 'production/build_race_simulation_data_v02.py'
      - 'production/live_bundle_publisher.py'
      - 'production/test_live_bundle_publisher.py'
      - '.github/workflows/race-simulator-learning.yml'

permissions:
  contents: write
concurrency:
  group: race-simulator-forward-learning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-learn:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'schedule' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required to verify the first durable pre-post commit.
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/
            /research/race_simulator/
            /reports/*/race_simulator_v02/
            /reports/*/race_simulator_evaluation/
            /reports/*/race_simulator_attempts.json
            /reports/*/PaceRecordingSchedule.json
            /reports/*/ResultData.json
            /reports/RaceSimulatorLearning.md
            /RaceData.json
            /RaceSimulationData.json
            /RaceSimulatorLearning.json
            /RaceSimulatorRecordingStatus.json
            /ResultData.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test capture, isolation, result pairing and promotion gates
        working-directory: production
        run: python3 -m unittest test_race_simulator_v02 test_race_simulator_learning test_race_simulator_operations test_live_bundle_publisher test_app_research_publish_window test_after_race_result_gate
      - name: Verify independent night catch-up triggers
        run: python3 production/test_nightly_research_recovery.py
      - name: Evaluate and safely publish the latest verified simulator evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # The after-race completeness gate is shared with the independent
          # research publisher. An after-hours workflow change (push), a
          # scheduled run, or a trusted workflow_run may catch up, but only
          # after ALL same-day race results are independently available.
          # Never reconstruct late formal T-10 captures or train on partial
          # same-day results.
          if python3 production/after_race_result_gate.py; then
            echo 'SIMULATOR_LEARNING_SOURCE_CONFIRMED'
          else
            rc=$?
            if [ "$rc" -eq 10 ]; then
              echo 'SIMULATOR_LEARNING_DEFERRED: incomplete or stale result sources'
              exit 0
            fi
            exit "$rc"
          fi
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            # Do not rebase competing generated JSON/operational status. Read
            # from the latest published main, preserving verified frozen input
            # journals and first durable commit timestamps.
            git fetch --no-tags origin main
            git reset --hard origin/main
            # All files below are derived by the cycle; clear only untracked
            # outputs of an earlier unsuccessful attempt in THIS runner.
            git clean -fd -- reports/*/race_simulator_evaluation research/race_simulator/models research/race_simulator/decisions
            python3 production/race_simulator_learning.py cycle
            python3 - <<'PY'
          import subprocess
          from pathlib import Path
          paths = [Path('RaceSimulatorLearning.json'), Path('RaceSimulatorRecordingStatus.json'), Path('reports/RaceSimulatorLearning.md')]
          paths += list(Path('research/race_simulator').rglob('*.json'))
          paths += list(Path('reports').glob('*/race_simulator_evaluation/*/*.json'))
          subprocess.run(['git', 'add', '--sparse', '--', *map(str, paths)], check=True)
          PY
            if git diff --cached --quiet; then
              echo 'SIMULATOR_LEARNING_UNCHANGED'
              exit 0
            fi
            git commit -m 'Evaluate prospective RaceSimulator forecasts and validation gates'
            if git push origin HEAD:main; then
              echo 'SIMULATOR_LEARNING_PUBLISHED'
              exit 0
            fi
            # A new candidate, irreversible holdout decision or model file
            # must not be re-decided on a changing source during the same run.
            if git diff --name-only HEAD^ HEAD -- research/race_simulator/decisions research/race_simulator/models | grep -q .; then
              echo '::error::Simulator decision/model conflicted; preserve artifact for independent review.' >&2
              exit 1
            fi
            echo "::warning::Main advanced; rebuilding derived simulator status from verified inputs ($attempt/4)"
            sleep $((attempt * 2))
          done
          echo '::error::Simulator publication exhausted bounded retries; preserved artifacts.' >&2
          exit 1
      - name: Preserve reports and fixed candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-simulator-learning-${{ github.run_id }}
          path: |
            RaceSimulatorLearning.json
            RaceSimulatorRecordingStatus.json
            reports/RaceSimulatorLearning.md
            research/race_simulator
            reports/*/race_simulator_evaluation
          if-no-files-found: ignore
          retention-days: 30
