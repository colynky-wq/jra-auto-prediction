name: RaceSimulator v0.2 CI and publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'RaceData.json'
      - 'AppResearchData.json'
      - 'HorseProfiles/**'
      - 'production/race_simulator_v02.py'
      - 'production/race_simulator_v02_adapter.py'
      - 'production/build_race_simulation_data_v02.py'
      - 'production/race_metadata_overrides.json'
      - 'production/test_race_simulator_v02.py'
      - 'ios/KeibaAI/**'
      - '.github/workflows/race-simulator-ci.yml'
  push:
    branches: [main]
    paths:
      - 'RaceData.json'
      - 'AppResearchData.json'
      - 'HorseProfiles/**'
      - 'production/race_simulator_v02.py'
      - 'production/race_simulator_v02_adapter.py'
      - 'production/build_race_simulation_data_v02.py'
      - 'production/race_metadata_overrides.json'
      - 'production/test_race_simulator_v02.py'
      - 'ios/KeibaAI/**'
      - '.github/workflows/race-simulator-ci.yml'

permissions:
  contents: write
concurrency:
  group: race-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RaceData.json
            AppResearchData.json
            HorseProfiles
            production
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Run v0.2 unit and independence tests
        working-directory: production
        run: python3 -m unittest test_race_simulator_v02.py
      - name: Build audited v0.2 simulation data
        run: |
          python3 production/build_race_simulation_data_v02.py \
            --race-data RaceData.json \
            --research-data AppResearchData.json \
            --profiles-dir HorseProfiles \
            --metadata-overrides production/race_metadata_overrides.json \
            --runs 250 --seed 20261103 --dt 0.5 \
            --output RaceSimulationData.json
      - name: Validate v0.2 quality gates
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('RaceSimulationData.json',encoding='utf-8'))
          assert d['schemaVersion']=='race-simulator-v0.2-batch'
          assert d['status']=='ok', d.get('errors')
          assert d['summary']['simulatedRaces']>0
          assert d['summary']['errorRaces']==0, d.get('errors')
          for r in d['races']:
              i=r['independence']
              assert i['usesPredictionAIForMotion'] is False
              assert i['usesMarketProbabilityForMotion'] is False
              assert i['usesOddsForMotion'] is False
              assert i['usesPopularityForMotion'] is False
              assert r['audit']['status']=='pass', r['audit']
              assert len(r['replay']['frames'])>20
              assert all(len(f['horses'])==len(r['horses']) for f in r['replay']['frames'])
          print(json.dumps(d['summary'],ensure_ascii=False))
          PY
      - name: Publish generated simulation data safely
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add --sparse RaceSimulationData.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'
          git commit -m 'Update RaceSimulator v0.2 output'
          for attempt in 1 2 3 4 5; do
            git fetch origin main --depth=50
            parent_sha="$(git rev-parse HEAD^)"; remote_sha="$(git rev-parse origin/main)"
            if [[ "$parent_sha" != "$remote_sha" ]]; then
              changed="$(git diff --name-only "$parent_sha" "$remote_sha" || true)"
              if printf '%s\n' "$changed" | grep -Eq '^(RaceData\.json|AppResearchData\.json|HorseProfiles/|production/race_simulator_v02|production/build_race_simulation_data_v02)'; then
                echo 'Relevant inputs advanced; skip stale output.'; exit 0
              fi
              git rebase origin/main
            fi
            git push origin HEAD:main && exit 0
          done
          exit 1

  ios-build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios
          fetch-depth: 1
      - name: Build KeibaAI for iOS Simulator
        run: |
          xcodebuild -project ios/KeibaAI/KeibaAI.xcodeproj -scheme KeibaAI -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
