name: KeibaAI Running Style Research

on:
  push:
    branches:
      - research/wide-budget-model-v1
    paths:
      - .github/workflows/keibaai-running-style-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  running-style-research:
    name: Validate running style tendency labels
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt

      - name: Compile research code
        run: python -m py_compile production/research_running_style.py

      - name: Run leakage-safe running style research
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python production/research_running_style.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-running-style-research
          path: running_style_artifacts/
          if-no-files-found: error
          retention-days: 14
