name: KeibaAI Result Downstream Read-only Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-result-downstream-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install identical production result-processing requirements
        run: |
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'lxml==6.0.2'
      - name: Capture first failing downstream stage without publishing
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -u production/diagnose_downstream_results.py
      - name: Preserve diagnostic (does not publish generated data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keibaai-readonly-downstream-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/keibaai-downstream-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
