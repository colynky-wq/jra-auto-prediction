name: KeibaAI Sprinters Stakes Replay

on:
  push:
    branches: [keibaai-sprinters-replay]
    paths:
      - '.github/workflows/keibaai-sprinters-replay.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'
      - name: Replay 2026 Sprinters Stakes with pre-race history only
        env:
          KEIBAAI_EARLY_DATE: '20260927'
          KEIBAAI_EARLY_STAGE: 'historical_replay'
        run: |
          cd production
          python - <<'PY'
          import re
          import unicodedata
          import numpy as np
          import pandas as pd
          import requests
          from bs4 import BeautifulSoup
          import early_prediction_runtime as ep

          date8='20260927'
          target_rid='202606040911'
          ep.base.TARGET_DATE8=date8
          ep.live.base.TARGET_DATE8=date8

          target_date=pd.Timestamp('2026-09-27')
          hist=ep.base.load_history(target_date)
          print('HISTORY_MAX_DATE', hist['日付'].max())

          def norm(x):
              s=unicodedata.normalize('NFKC', str(x or ''))
              s=re.sub(r'[\s・\.．]', '', s)
              s=re.sub(r'^(美浦|栗東)', '', s)
              return s

          hist_jockeys=sorted(set(hist['騎手'].dropna().astype(str)))
          hist_trainers=sorted(set(hist['調教師'].dropna().astype(str)))

          def resolve_abbrev(raw, candidates):
              n=norm(raw)
              if not n:
                  return str(raw)
              scored=[]
              for c in candidates:
                  cn=norm(c)
                  if n==cn:
                      scored.append((10000+len(cn), c))
                  elif cn.startswith(n) or n.startswith(cn):
                      scored.append((5000+min(len(n),len(cn)), c))
                  elif n in cn or cn in n:
                      scored.append((1000+min(len(n),len(cn)), c))
              if scored:
                  scored.sort(reverse=True)
                  return scored[0][1]
              return str(raw)

          def historical_entry_table(race_id, date8_arg, jst):
              url=f'https://race.netkeiba.com/race/shutuba.html?race_id={race_id}'
              r=requests.get(url, headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja'}, timeout=30)
              r.raise_for_status()
              html=r.content.decode('utf-8', errors='replace')
              soup=BeautifulSoup(html, 'html.parser')
              horse_rows=soup.select('tr.HorseList')
              print('HIST_HORSE_ROWS_RAW', len(horse_rows))
              if horse_rows:
                  print('HIST_FIRST_ROW', ' | '.join(horse_rows[0].stripped_strings))

              rows=[]
              for tr in horse_rows:
                  no_node=tr.select_one('.Umaban')
                  name_node=tr.select_one('.HorseName a') or tr.select_one('.HorseInfo a')
                  age_node=tr.select_one('.Barei')
                  jockey_node=tr.select_one('.Jockey a') or tr.select_one('.Jockey')
                  trainer_node=tr.select_one('.Trainer a') or tr.select_one('.Trainer')
                  bw_node=tr.select_one('.Weight')
                  if not all([no_node,name_node,age_node,jockey_node,trainer_node]):
                      continue
                  mno=re.search(r'\d+', no_node.get_text(' ',strip=True))
                  mage=re.search(r'(\d+)', age_node.get_text(' ',strip=True))
                  if not mno or not mage:
                      continue
                  no=int(mno.group())
                  name=name_node.get_text(' ',strip=True)
                  age=int(mage.group(1))
                  carried_td=age_node.find_next_sibling('td')
                  mcarry=re.search(r'\d+(?:\.\d+)?', carried_td.get_text(' ',strip=True) if carried_td else '')
                  if not mcarry:
                      continue
                  carried=float(mcarry.group())
                  jockey=resolve_abbrev(jockey_node.get_text(' ',strip=True), hist_jockeys)
                  trainer=resolve_abbrev(trainer_node.get_text(' ',strip=True), hist_trainers)
                  bw_text=bw_node.get_text(' ',strip=True) if bw_node else ''
                  mw=re.search(r'(\d{3})\s*\(\s*([+-]?\d+)\s*\)', bw_text)
                  if mw:
                      bw=float(mw.group(1)); diff=float(mw.group(2))
                  else:
                      mw2=re.search(r'(\d{3})', bw_text)
                      bw=float(mw2.group(1)) if mw2 else np.nan
                      diff=np.nan
                  rows.append({'馬番':no,'馬名':name,'年齢':age,'斤量':carried,
                               '騎手_JRA':jockey,'調教師_JRA':trainer,'馬体重':bw,'増減':diff})
              d=pd.DataFrame(rows)
              if d.empty:
                  raise RuntimeError('historical HorseList parse returned 0 rows')
              d=d.sort_values('馬番').reset_index(drop=True)
              print('HIST_ENTRY_ROWS', len(d))
              print(d.to_string(index=False))
              return d, ep.base.now_jst(), url

          ep.base.fetch_jra_entry_table=historical_entry_table
          ep.live.base.fetch_jra_entry_table=historical_entry_table

          original_fetch_meta = ep.base.fetch_meta
          def corrected_fetch_meta(race):
              out = original_fetch_meta(race)
              if str(out.get('race_id')) == target_rid:
                  out['class'] = 'OP'
              return out
          ep.base.fetch_meta = corrected_fetch_meta
          ep.live.base.fetch_meta = corrected_fetch_meta

          races=ep.base.fetch_schedule(date8)
          target=[r for r in races if str(r.get('race_id'))==target_rid]
          if len(target) != 1:
              raise RuntimeError(f'Sprinters target count={len(target)}')
          out=ep._safe_predict(target[0], hist, target_date)
          ranked=out.sort_values('AI勝率(%)', ascending=False).reset_index(drop=True)
          print('SPRINTERS_REPLAY_BEGIN')
          print(ranked.to_json(orient='records', force_ascii=False))
          print('SPRINTERS_REPLAY_END')
          PY
