name: Patch 本会外 Trainer Parser

on:
  push:
    branches: [fix/jra-honkaigai-trainer-20261023]
    paths:
      - '.github/workflows/patch-honkaigai-trainer.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas numpy
      - name: Inspect 本会外 rows
        env:
          PYTHONPATH: production
        run: |
          python - <<'PY'
          from datetime import timedelta, timezone
          import requests
          from bs4 import BeautifulSoup
          from jra_entry_source import discover_entry_url, HEADERS
          JST=timezone(timedelta(hours=9))
          for rid, numbers in [('202608040810',{7,9}),('202605040811',{8})]:
              s=requests.Session(); s.headers.update(HEADERS)
              url=discover_entry_url(rid,'20261024',s)
              r=s.get(url,timeout=20); text=r.content.decode(r.apparent_encoding or 'shift_jis',errors='replace')
              soup=BeautifulSoup(text,'html.parser')
              table=soup.find('table')
              for tr in table.find_all('tr'):
                  tds=tr.find_all('td')
                  if len(tds)<4: continue
                  raw=tds[1].get_text(' ',strip=True)
                  import re
                  m=re.search(r'\d+',raw)
                  if not m or int(m.group()) not in numbers: continue
                  info=tds[2]
                  print('ROW',rid,int(m.group()))
                  print('TEXT',repr(info.get_text(' | ',strip=True)))
                  print('ANCHORS',[(a.get_text(' ',strip=True),a.get('href')) for a in info.find_all('a')])
                  print('HTML',str(info)[:6000])
          PY