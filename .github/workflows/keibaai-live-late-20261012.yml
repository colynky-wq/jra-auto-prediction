name: KeibaAI Late Live 2026-10-12

on:
  schedule:
    - cron: '45 6 12 10 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keibaai-live-late-20261012
  cancel-in-progress: false

jobs:
  monitor:
    name: Late live Win Top2 Top3 monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Guard exact target date
        run: |
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d)" != "20261012" ]; then
            echo "Not target date; exiting without prediction."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4'

      - name: Smoke-test Top2 Top3 runtime
        run: python production/smoke_topk_runtime.py

      - name: Configure git publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Monitor late races and publish each prediction
        env:
          KEIBAAI_LIVE_DATE: '20261012'
          KEIBAAI_LIVE_MODE: 'live'
          KEIBAAI_LIVE_RACE_ID: ''
          KEIBAAI_LIVE_MAX_MINUTES: '60'
          KEIBAAI_LIVE_POLL_SECONDS: '20'
          KEIBAAI_PUBLISH_RACEDATA: 'true'
        run: |
          set -euo pipefail

          publish_if_changed() {
            if ! git diff --quiet -- RaceData.json; then
              git add RaceData.json
              git commit -m "Publish late live Top2 Top3 RaceData 2026-10-12" || true
              git pull --rebase origin main
              git push origin HEAD:main
              echo "Published RaceData.json at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
            fi
          }

          python production/live_monitor_topk_publish.py &
          monitor_pid=$!
          monitor_exit=0

          while kill -0 "$monitor_pid" 2>/dev/null; do
            sleep 20
            publish_if_changed
          done

          wait "$monitor_pid" || monitor_exit=$?
          publish_if_changed
          exit "$monitor_exit"
