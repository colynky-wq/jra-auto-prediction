name: KeibaAI Simplify UI Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keibaai-simplify-ui-once.yml'

permissions:
  contents: write

jobs:
  simplify-ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Apply presentation-only UI patch
        run: python3 tools/keibaai_simplify_ui_once.py

      - name: Verify intended UI changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'static let primaryCases: [KeibaAIMainTab] = [.today, .ticket, .research, .performance]' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift
          grep -F 'case recommended = "おすすめ"' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift
          grep -F 'Label("AIの結論"' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift
          grep -F 'Label("理由を見る"' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift
          grep -F 'Label("研究データを見る"' ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift
          ! grep -F 'ZStack(alignment: .bottomTrailing)' ios/KeibaAI/KeibaAI/KeibaAIApp.swift

      - name: Typecheck iOS Swift sources
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc \
            -typecheck \
            -parse-as-library \
            -sdk "$SDK" \
            -target arm64-apple-ios18.0-simulator \
            ios/KeibaAI/KeibaAI/*.swift

      - name: Commit intuitive UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/KeibaAI/KeibaAI/KeibaAI_NewDesignView.swift ios/KeibaAI/KeibaAI/KeibaAIApp.swift
          git commit -m 'Simplify KeibaAI navigation and race decisions'
          git push origin HEAD:main

      - name: Package updated Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cp -R ios/KeibaAI KeibaAI_INTUITIVE_UI_20261101
          printf '%s\n' 'KeibaAI 直感UI版。4つの主要画面（今日・馬券・研究・成績）、今日の3モード、レース詳細の「AIの結論→理由→研究」を採用。予測ロジックは変更していません。' > KeibaAI_INTUITIVE_UI_20261101/README_最初に読む.txt
          zip -qr KeibaAI_INTUITIVE_UI_20261101.zip KeibaAI_INTUITIVE_UI_20261101

      - uses: actions/upload-artifact@v4
        with:
          name: KeibaAI_INTUITIVE_UI_20261101
          path: KeibaAI_INTUITIVE_UI_20261101.zip
          if-no-files-found: error
          retention-days: 14
