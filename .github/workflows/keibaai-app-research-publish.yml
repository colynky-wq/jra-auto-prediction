name: KeibaAI App Research Display

on:
  pull_request:
    paths:
      - 'production/app_research_runtime.py'
      - 'production/build_app_research_data.py'
      - 'production/test_app_research_data.py'
      - 'production/validate_app_research_publish.py'
      - 'production/formation_runtime.py'
      - 'production/research_formation.py'
      - 'production/test_formation_reference.py'
      - 'production/production_history.parquet'
      - '.github/workflows/keibaai-app-research-publish.yml'
      - '.github/workflows/keibaai-live-permanent.yml'
  push:
    branches: [main]
    paths:
      - 'production/app_research_runtime.py'
      - 'production/build_app_research_data.py'
      - 'production/test_app_research_data.py'
      - 'production/validate_app_research_publish.py'
      - 'production/formation_runtime.py'
      - 'production/research_formation.py'
      - 'production/test_formation_reference.py'
      - 'production/production_history.parquet'
      - '.github/workflows/keibaai-app-research-publish.yml'
  schedule:
    - cron: '50 9 * * *' # 18:50 JST; live updates use the existing publisher.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keibaai-app-research-display
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install dependencies
        run: pip install -r production/requirements.txt
      - name: Run regression tests
        run: |
          python -m unittest discover -s production -p 'test_app_research_data.py'
          python -m unittest discover -s production -p 'test_formation_reference.py'
      - name: Evaluate initial-position reference on 2024 and 2025
        run: python production/research_formation.py
      - name: Build research display and evaluate 2025
        run: python production/build_app_research_data.py --evaluate
      - name: Validate display outputs
        run: python production/validate_app_research_publish.py
      - uses: actions/upload-artifact@v4
        with:
          name: keibaai-app-research-display
          path: |
            AppResearchData.json
            reports/RunningStyleValidation.json
            reports/FormationValidation.json
          retention-days: 14
      - name: Publish research display
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KeibaAI GitHub Actions'
          git config user.email 'keibaai@users.noreply.github.com'

          stage_outputs() {
            git add AppResearchData.json reports/RunningStyleValidation.json reports/FormationValidation.json
            for file in reports/*/AppResearchData.json; do
              [ -f "$file" ] || continue
              git add "$file"
            done
          }

          rebuild_from_current_main() {
            # Never rebase competing generated JSON. Rebuild derived outputs from
            # the latest committed inputs and validate the same safety contract.
            git reset --hard origin/main
            python -m unittest discover -s production -p 'test_app_research_data.py'
            python -m unittest discover -s production -p 'test_formation_reference.py'
            python production/research_formation.py
            python production/build_app_research_data.py --evaluate
            python production/validate_app_research_publish.py
          }

          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Main advanced; rebuilding app research from current inputs (${attempt}/4)."
              rebuild_from_current_main
            fi

            stage_outputs
            if git diff --cached --quiet; then
              echo 'APP_RESEARCH_UNCHANGED: no derived output changed.'
              exit 0
            fi

            git commit -m 'Update app research display'
            if git push origin HEAD:main; then
              echo 'APP_RESEARCH_PUBLISHED'
              exit 0
            fi

            echo "::warning::Concurrent main update; retry from current source (${attempt}/4)."
            sleep $((attempt * 2))
          done
          echo '::error::App research publication exhausted bounded retries.' >&2
          exit 1
