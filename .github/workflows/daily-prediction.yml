name: Daily Horse Racing Prediction

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn gspread google-auth google-auth-oauthlib google-auth-httplib2
      
      - name: Download pkl from Releases
        run: |
          wget https://github.com/colynky-wq/jra-auto-prediction/releases/download/v1.0/history_data.pkl
      
      - name: Run prediction
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python main.py
